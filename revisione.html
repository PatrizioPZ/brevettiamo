<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisione - BrevettIAmo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Libre Baskerville', Georgia, serif;
    background: #f5f0e8;
    min-height: 100vh;
    color: #3d2b1f;
}

.pergamena {
    max-width: 900px;
    margin: 40px auto;
    background: #faf6f0;
    border: 2px solid #c9a96e;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(61,43,31,0.15), inset 0 0 60px rgba(201,169,110,0.1);
    padding: 50px;
    position: relative;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}
.logo h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    color: #8b0000;
    letter-spacing: 2px;
}

.titolo-sezione {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: #8b0000;
    margin-bottom: 20px;
    text-align: center;
    border-bottom: 2px solid #c9a96e;
    padding-bottom: 15px;
}

.sezione {
    margin: 25px 0;
    padding: 20px;
    background: rgba(201,169,110,0.08);
    border: 1px solid #d4c4a8;
    border-radius: 4px;
}

.sezione h2 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    font-size: 1.1rem;
    margin-bottom: 15px;
}

.contenuto-preview {
    background: #fff;
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    padding: 20px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 15px;
}

.textarea-edit {
    width: 100%;
    min-height: 200px;
    padding: 15px;
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 0.95rem;
    line-height: 1.6;
    background: #fff;
    resize: vertical;
}

.textarea-edit:focus {
    outline: none;
    border-color: #8b0000;
    box-shadow: 0 0 5px rgba(139,0,0,0.1);
}

.btn {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
    padding: 16px 40px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    background: #c9a96e;
    color: #fff;
    box-shadow: 0 4px 15px rgba(201,169,110,0.3);
    margin: 10px;
}

.btn:hover {
    background: #b8985a;
    transform: translateY(-2px);
}

.btn-secondary {
    background: #8b7355;
}

.btn-secondary:hover {
    background: #6b5a45;
}

.btn-danger {
    background: #8b0000;
}

.btn-danger:hover {
    background: #6b0000;
}

.actions {
    text-align: center;
    margin-top: 30px;
}

.info-box {
    background: rgba(139,0,0,0.05);
    border: 1px dashed #8b0000;
    border-radius: 4px;
    padding: 15px;
    margin: 15px 0;
    font-size: 0.9rem;
}

.info-box strong {
    color: #8b0000;
}

@media (max-width: 600px) {
    .pergamena { padding: 25px; margin: 20px; }
}
</style>
<base target="_blank">
</head>
<body>

<div class="pergamena">
    <div class="logo">
        <h1>REVISIONE E CORREZIONE</h1>
    </div>

    <div class="titolo-sezione" id="titolo-servizio">Revisione Risultato</div>

    <div id="contenuto-container">
        <!-- Qui verra inserito il contenuto da revisionare -->
    </div>

    <div class="actions">
        <button class="btn" onclick="confermaRisultato()">CONFERMA E PROSEGUI</button>
        <button class="btn btn-secondary" onclick="rigenera()">RIGENERA</button>
        <button class="btn btn-danger" onclick="tornaIndietro()">TORNA INDIETRO</button>
    </div>
</div>

<script>
// ==========================================
// REVISIONE BREVETTIAMO
// ==========================================

const servizioId = new URLSearchParams(window.location.search).get("servizio") || "servizio-deposito";
const risultatoJSON = localStorage.getItem("brevettiamo_risultato");

function caricaRisultato() {
    console.log("[Revisione] Caricamento risultato per servizio: " + servizioId);

    if (!risultatoJSON) {
        mostraErrore("Nessun risultato da revisionare. Torna indietro e riprova.");
        return;
    }

    try {
        const risultato = JSON.parse(risultatoJSON);
        console.log("[Revisione] Dati caricati:", risultato);

        // Titolo servizio
        const titoli = {
            "servizio-deposito": "Deposito Brevetto - Revisione",
            "servizio-prior-art": "Ricerca Prior Art - Revisione",
            "servizio-rivendicazioni": "Rivendicazioni - Revisione",
            "servizio-tavole": "Tavole Tecniche - Revisione",
            "servizio-cad": "Disegni CAD - Revisione"
        };

        document.getElementById("titolo-servizio").textContent = titoli[servizioId] || "Revisione Risultato";

        const container = document.getElementById("contenuto-container");

        if (risultato.documenti) {
            // Revisione documenti
            let html = '';
            for (let i = 0; i < risultato.documenti.length; i++) {
                const doc = risultato.documenti[i];
                html += '<div class="sezione">';
                html += '<h2>' + escapeHtml(doc.nome) + '</h2>';
                html += '<div class="contenuto-preview" id="preview-' + i + '">' + escapeHtml(doc.contenuto) + '</div>';
                html += '<textarea class="textarea-edit" id="edit-' + i + '" placeholder="Modifica il testo qui...">' + escapeHtml(doc.contenuto) + '</textarea>';
                html += '</div>';
            }
            container.innerHTML = html;
        } else if (risultato.contenuto) {
            // Contenuto singolo
            container.innerHTML = 
                '<div class="sezione">' +
                '<h2>Contenuto Generato</h2>' +
                '<div class="contenuto-preview" id="preview-0">' + escapeHtml(risultato.contenuto) + '</div>' +
                '<textarea class="textarea-edit" id="edit-0" placeholder="Modifica il testo qui...">' + escapeHtml(risultato.contenuto) + '</textarea>' +
                '</div>';
        } else if (risultato.rivendicazioni) {
            // Rivendicazioni
            let html = '<div class="sezione"><h2>Rivendicazioni</h2>';
            for (let i = 0; i < risultato.rivendicazioni.length; i++) {
                html += '<div class="contenuto-preview" id="preview-' + i + '">' + escapeHtml(risultato.rivendicazioni[i]) + '</div>';
                html += '<textarea class="textarea-edit" id="edit-' + i + '" placeholder="Modifica la rivendicazione...">' + escapeHtml(risultato.rivendicazioni[i]) + '</textarea>';
            }
            html += '</div>';
            container.innerHTML = html;
        } else {
            // Fallback
            container.innerHTML = 
                '<div class="sezione">' +
                '<h2>Dati Completi</h2>' +
                '<div class="contenuto-preview">' + escapeHtml(JSON.stringify(risultato, null, 2)) + '</div>' +
                '<textarea class="textarea-edit" id="edit-0" placeholder="Modifica...">' + escapeHtml(JSON.stringify(risultato, null, 2)) + '</textarea>' +
                '</div>';
        }

    } catch (error) {
        console.error("[Revisione] Errore parsing:", error);
        mostraErrore("Errore nel caricamento del risultato.");
    }
}

function confermaRisultato() {
    console.log("[Revisione] Conferma risultato");

    try {
        const risultato = JSON.parse(risultatoJSON);

        // Aggiorna i contenuti modificati
        if (risultato.documenti) {
            for (let i = 0; i < risultato.documenti.length; i++) {
                const textarea = document.getElementById("edit-" + i);
                if (textarea) {
                    risultato.documenti[i].contenuto = textarea.value;
                }
            }
        } else if (risultato.contenuto) {
            const textarea = document.getElementById("edit-0");
            if (textarea) {
                risultato.contenuto = textarea.value;
            }
        } else if (risultato.rivendicazioni) {
            for (let i = 0; i < risultato.rivendicazioni.length; i++) {
                const textarea = document.getElementById("edit-" + i);
                if (textarea) {
                    risultato.rivendicazioni[i] = textarea.value;
                }
            }
        }

        // Salva risultato revisionato
        localStorage.setItem("brevettiamo_risultato_revisionato", JSON.stringify(risultato));
        localStorage.setItem("brevettiamo_risultato", JSON.stringify(risultato));

        // Vai al risultato finale
        window.location.href = "/brevettiamo/risultato.html?servizio=" + encodeURIComponent(servizioId);

    } catch (error) {
        console.error("[Revisione] Errore conferma:", error);
        alert("Errore nel salvataggio delle modifiche.");
    }
}

function rigenera() {
    console.log("[Revisione] Rigenera");
    // Torna a elaborazione per rigenerare
    window.location.href = "/brevettiamo/elaborazione.html?servizio=" + encodeURIComponent(servizioId);
}

function tornaIndietro() {
    console.log("[Revisione] Torna indietro");
    window.history.back();
}

function mostraErrore(messaggio) {
    document.getElementById("contenuto-container").innerHTML = 
        '<div class="info-box"><strong>Errore:</strong> ' + messaggio + '</div>';
}

function escapeHtml(text) {
    if (!text) return "";
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// Carica risultato all avvio
document.addEventListener("DOMContentLoaded", caricaRisultato);
</script>

</body>
</html>
