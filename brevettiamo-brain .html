<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrevettIAmo Brain v2.0 - Workflow Reale</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0d1b2a 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .fortress-badge {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            color: white;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #e94560, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #2ecc71; box-shadow: 0 0 8px #2ecc71;
        }
        .status-dot.offline { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
        .command-box { position: relative; margin-bottom: 15px; }
        textarea {
            width: 100%; min-height: 150px;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 15px; padding: 15px;
            color: #e0e0e0; font-size: 14px;
            line-height: 1.5; resize: vertical;
        }
        textarea:focus {
            outline: none; border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.2);
        }
        .encrypt-indicator {
            position: absolute; top: 12px; right: 12px;
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71; padding: 4px 10px;
            border-radius: 15px; font-size: 10px;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }
        .action-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn {
            flex: 1; min-width: 140px; padding: 12px 20px;
            border: none; border-radius: 10px;
            font-size: 13px; font-weight: bold;
            cursor: pointer; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary {
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-danger {
            background: linear-gradient(90deg, #c0392b, #e74c3c);
            color: white;
        }
        .result-panel {
            background: rgba(0,0,0,0.25);
            border-radius: 15px; padding: 20px;
            margin-bottom: 15px; display: none;
        }
        .result-panel.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-body {
            background: rgba(0,0,0,0.2);
            border-radius: 10px; padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px; line-height: 1.7;
            color: #a0a0a0; max-height: 350px;
            overflow-y: auto; white-space: pre-wrap;
        }
        .security-log {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px; padding: 15px;
            font-size: 11px; color: #666;
        }
        .security-log h3 {
            color: #e94560; margin-bottom: 8px;
            font-size: 12px;
        }
        .log-entry { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .action-bar { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="fortress-badge">FORTEZZA BREVETTIAMO - CRITTOGRAFIA END-TO-END</div>

    <div class="container">
        <h1>BREVETTIAMO BRAIN v2.0</h1>
        <p class="subtitle">Workflow Reale - Groq via GitHub Actions - Zero Click</p>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="dot-brain"></div>
                <span>Brain: <span id="txt-brain">Online</span></span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="dot-groq"></div>
                <span>Groq: <span id="txt-groq">Pronto</span></span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="dot-crypto"></div>
                <span>Crittografia: <span id="txt-crypto">Attiva</span></span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="dot-git"></div>
                <span>Git: <span id="txt-git">Pronto</span></span>
            </div>
        </div>

        <div class="command-box">
            <div class="encrypt-indicator">AES-256-GCM</div>
            <textarea id="command-input" placeholder="Scrivi qui la tua richiesta. Il workflow Brain la elaborera automaticamente."></textarea>
        </div>

        <div class="action-bar">
            <button class="btn btn-primary" onclick="inviaComando()">INVIA A WORKFLOW</button>
            <button class="btn btn-secondary" onclick="controllaRisposta()">CONTROLLA RISPOSTA</button>
            <button class="btn btn-danger" onclick="pulisci()">PULISCI</button>
        </div>

        <div class="result-panel" id="result-panel">
            <div style="font-size:14px; color:#2ecc71; font-weight:bold; margin-bottom:15px;">Risultato</div>
            <div class="result-body" id="result-body">In attesa...</div>
        </div>

        <div class="security-log">
            <h3>Audit Trail</h3>
            <div id="security-entries"></div>
        </div>
    </div>

<script>
const BRAIN_VERSION = '2.0.0-WORKFLOW';
let repo = 'PatrizioPZ/brevettiamo';
let ghToken = null;

function now() {
    return new Date().toISOString().replace('T',' ').substring(0,19);
}

function aggiungiLog(msg) {
    const c = document.getElementById('security-entries');
    const e = document.createElement('div');
    e.className = 'log-entry';
    e.textContent = '[' + now() + '] ' + msg;
    c.insertBefore(e, c.firstChild);
}

async function getGitHubToken() {
    if (ghToken) return ghToken;
    try {
        if (typeof supabase !== 'undefined') {
            const { data, error } = await supabase
                .from('secrets')
                .select('value')
                .eq('key', 'GH_TOKEN')
                .single();
            if (!error && data) {
                ghToken = data.value;
                return ghToken;
            }
        }
    } catch (e) {
        console.log('Supabase non disponibile, uso token manuale');
    }
    return null;
}

async function writeFile(filename, content) {
    const token = await getGitHubToken();
    if (!token) {
        throw new Error('GitHub token non configurato. Inseriscilo nel pannello Installazione.');
    }

    let sha = null;
    try {
        const getRes = await fetch('https://api.github.com/repos/' + repo + '/contents/' + filename, {
            headers: { 'Authorization': 'token ' + token }
        });
        if (getRes.ok) {
            const data = await getRes.json();
            sha = data.sha;
        }
    } catch (e) {}

    const body = {
        message: 'brain: richiesta da interfaccia v2.0',
        content: btoa(unescape(encodeURIComponent(content))),
        branch: 'main'
    };
    if (sha) body.sha = sha;

    const putRes = await fetch('https://api.github.com/repos/' + repo + '/contents/' + filename, {
        method: 'PUT',
        headers: {
            'Authorization': 'token ' + token,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
    });

    if (!putRes.ok) {
        const err = await putRes.text();
        throw new Error('GitHub error: ' + putRes.status + ' - ' + err);
    }
}

async function readFile(filename) {
    try {
        const res = await fetch('https://raw.githubusercontent.com/' + repo + '/main/' + filename);
        if (!res.ok) return null;
        return await res.text();
    } catch (e) {
        return null;
    }
}

async function inviaComando() {
    const input = document.getElementById('command-input');
    const richiesta = input.value.trim();

    if (!richiesta) {
        alert('Inserisci una richiesta');
        return;
    }

    aggiungiLog('Invio richiesta al workflow...');

    try {
        await writeFile('brain-request.txt', richiesta);
        aggiungiLog('brain-request.txt scritto con successo');
        aggiungiLog('Workflow Brain attivato. Attendi 30-60 secondi...');

        document.getElementById('result-panel').classList.add('active');
        document.getElementById('result-body').textContent = 'Richiesta inviata. Workflow in esecuzione...\nAttendi 30-60 secondi e clicca "Controlla Risposta".';

    } catch (e) {
        aggiungiLog('ERRORE: ' + e.message);
        alert('Errore: ' + e.message);
    }
}

async function controllaRisposta() {
    aggiungiLog('Controllo brain-response.txt...');

    const risposta = await readFile('brain-response.txt');

    if (risposta) {
        aggiungiLog('Risposta trovata!');
        document.getElementById('result-panel').classList.add('active');
        document.getElementById('result-body').textContent = risposta;
    } else {
        aggiungiLog('Risposta non ancora pronta. Riprova tra qualche secondo.');
        document.getElementById('result-panel').classList.add('active');
        document.getElementById('result-body').textContent = 'Risposta non ancora pronta.\nIl workflow impiega circa 30-60 secondi.\nRiprova tra poco.';
    }
}

function pulisci() {
    document.getElementById('command-input').value = '';
    document.getElementById('result-panel').classList.remove('active');
    document.getElementById('result-body').textContent = 'In attesa...';
    aggiungiLog('Pannello pulito');
}

document.addEventListener('DOMContentLoaded', () => {
    aggiungiLog('BrevettIAmo Brain v' + BRAIN_VERSION + ' inizializzato');
    aggiungiLog('Workflow: GitHub Actions + Groq');
    aggiungiLog('Per usare: inserisci GH_TOKEN in Supabase secrets');
});
</script>
</body>
</html>
