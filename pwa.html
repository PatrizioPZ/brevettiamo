<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BrevettIAmo - Spazio File</title><style>body{font-family:sans-serif;background:#1a1a2e;color:#e0e0e0;max-width:900px;margin:0 auto;padding:20px}header{text-align:center;padding:20px 0;border-bottom:2px solid #0f3460;margin-bottom:20px}h1{margin:0}.subtitle{color:#a0a0c0;font-style:italic}.drop-zone{border:3px dashed #0f3460;border-radius:16px;padding:40px;text-align:center;margin:20px 0;cursor:pointer}.drop-zone:hover{border-color:#4a90d9}.file-list{display:grid;gap:10px}.file-card{background:#16213e;border:1px solid #0f3460;border-radius:8px;padding:12px;display:flex;gap:10px;align-items:center}.file-info{flex:1}.file-name{font-weight:bold}.file-meta{font-size:0.8rem;color:#a0a0c0}.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer}.btn-danger{background:#8b0000;color:#fff}footer{text-align:center;padding:20px;color:#a0a0c0;font-size:0.8rem;border-top:1px solid #0f3460;margin-top:20px}</style></head><body><header><h1>BrevettIAmo</h1><p class="subtitle">Spazio File Personale</p></header><div style="display:flex;justify-content:space-between;margin-bottom:20px"><a href="servizi.html" style="color:#e0e0e0;text-decoration:none">&larr; Torna ai Servizi</a><button id="installBtn" style="display:none;padding:8px 16px;background:#1a5a3a;color:#fff;border:none;border-radius:6px;cursor:pointer">Installa App</button></div><div class="drop-zone" id="dropZone"><p><strong>Carica File</strong></p><p style="color:#a0a0c0;font-size:0.9rem">Trascina qui o clicca per selezionare</p><input type="file" id="fileInput" style="display:none" multiple></div><h2 style="border-bottom:1px solid #0f3460;padding-bottom:8px;margin-bottom:15px">I Tuoi File</h2><div class="file-list" id="fileList"><p style="text-align:center;color:#a0a0c0;padding:30px">Nessun file caricato</p></div><footer><p>BrevettIAmo - Spazio File Personale</p><p>Versione Beta v1.0</p></footer><script>(function(){var files=JSON.parse(localStorage.getItem("brevettiamo_files")||"[]");var dropZone=document.getElementById("dropZone");var fileInput=document.getElementById("fileInput");var fileList=document.getElementById("fileList");function render(){if(files.length===0){fileList.innerHTML='<p style="text-align:center;color:#a0a0c0;padding:30px">Nessun file caricato</p>';return}fileList.innerHTML="";files.forEach(function(f,i){var div=document.createElement("div");div.className="file-card";div.innerHTML='<div class="file-info"><div class="file-name">'+f.name+'</div><div class="file-meta">'+f.size+' &bull; '+(f.type||"file")+' &bull; '+(f.date||"")+'</div></div><button class="btn btn-danger" onclick="del('+i+')">Elimina</button>';fileList.appendChild(div);});}window.del=function(i){if(!confirm("Eliminare?"))return;files.splice(i,1);localStorage.setItem("brevettiamo_files",JSON.stringify(files));render()};function handle(fl){Array.from(fl).forEach(function(file){var reader=new FileReader();reader.onload=function(e){files.push({name:file.name,size:file.size+" B",type:file.type||"file",date:new Date().toLocaleString("it-IT"),data:e.target.result});localStorage.setItem("brevettiamo_files",JSON.stringify(files));render();};reader.readAsDataURL(file);});}dropZone.onclick=function(){fileInput.click()};dropZone.ondragover=function(e){e.preventDefault();dropZone.style.borderColor="#4a90d9"};dropZone.ondragleave=function(){dropZone.style.borderColor="#0f3460"};dropZone.ondrop=function(e){e.preventDefault();dropZone.style.borderColor="#0f3460";handle(e.dataTransfer.files)};fileInput.onchange=function(e){handle(e.target.files)};var deferredPrompt;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").style.display="inline-block"});document.getElementById("installBtn").onclick=function(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt=null};render();})();</script></body></html>
