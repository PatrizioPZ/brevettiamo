<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestione Prezzi | BrevettIAmo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --pergamena: #f5f0e8;
            --pergamena-scuro: #e8e0d0;
            --oro: #c9a84c;
            --oro-scuro: #a88a3a;
            --nero: #1a1a1a;
            --grigio: #666;
            --rosso: #c0392b;
            --verde: #27ae60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lora', serif;
            background: var(--nero);
            color: var(--nero);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--pergamena);
            border-radius: 8px;
            padding: 30px;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: var(--oro);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--oro);
            text-decoration: none;
            font-family: 'Cinzel', serif;
        }
        .back-link:hover { text-decoration: underline; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--pergamena-scuro);
        }
        th {
            background: var(--oro);
            color: white;
            font-family: 'Cinzel', serif;
            font-weight: 600;
        }
        td { font-family: 'Lora', serif; }
        tr:hover { background: var(--pergamena); }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--pergamena-scuro);
            border-radius: 4px;
            font-family: 'Lora', serif;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-save {
            background: var(--verde);
            color: white;
        }
        .btn-save:hover { background: #1e8449; }
        .btn-refresh {
            background: var(--oro);
            color: white;
            margin-left: 10px;
        }
        .btn-refresh:hover { background: var(--oro-scuro); }
        .actions {
            margin-top: 20px;
            text-align: center;
        }
        .message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-style: italic;
            color: var(--grigio);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="admin.html" class="back-link">← Torna al Pannello Admin</a>
        <h1>Gestione Prezzi BrevettIAmo</h1>
        <div id="message" class="message"></div>
        <div id="loading" class="loading">Caricamento prezzi...</div>
        <div id="content" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome Servizio</th>
                        <th>Prezzo Base (€)</th>
                        <th>Prezzo Pro (€)</th>
                        <th>Prezzo Enterprise (€)</th>
                        <th>Attivo</th>
                    </tr>
                </thead>
                <tbody id="prezzi-body">
                </tbody>
            </table>
            <div class="actions">
                <button class="btn btn-save" onclick="salvaPrezzi()">Salva Modifiche</button>
                <button class="btn btn-refresh" onclick="caricaPrezzi()">Ricarica</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jtekrvlmqnluvaiapmwb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_p9WH85YPfwtaKp4tfcDwug_Q9duausk';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let prezziData = [];

        async function caricaPrezzi() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';

            try {
                const { data, error } = await supabaseClient
                    .from('config_prezzi')
                    .select('*')
                    .order('id');

                if (error) throw error;

                prezziData = data || [];
                mostraPrezzi();
            } catch (err) {
                showMessage('Errore caricamento: ' + err.message, 'error');
            }
        }

        function mostraPrezzi() {
            const tbody = document.getElementById('prezzi-body');
            tbody.innerHTML = '';

            prezziData.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.id}</td>
                    <td><input type="text" id="nome_${index}" value="${item.nome || ''}"></td>
                    <td><input type="number" id="base_${index}" value="${item.prezzo_base || 0}" step="0.01"></td>
                    <td><input type="number" id="pro_${index}" value="${item.prezzo_pro || 0}" step="0.01"></td>
                    <td><input type="number" id="enterprise_${index}" value="${item.prezzo_enterprise || 0}" step="0.01"></td>
                    <td><input type="checkbox" id="attivo_${index}" ${item.attivo ? 'checked' : ''}></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        async function salvaPrezzi() {
            try {
                for (let i = 0; i < prezziData.length; i++) {
                    const item = prezziData[i];
                    const updates = {
                        nome: document.getElementById(`nome_${i}`).value,
                        prezzo_base: parseFloat(document.getElementById(`base_${i}`).value) || 0,
                        prezzo_pro: parseFloat(document.getElementById(`pro_${i}`).value) || 0,
                        prezzo_enterprise: parseFloat(document.getElementById(`enterprise_${i}`).value) || 0,
                        attivo: document.getElementById(`attivo_${i}`).checked
                    };

                    const { error } = await supabaseClient
                        .from('config_prezzi')
                        .update(updates)
                        .eq('id', item.id);

                    if (error) throw error;
                }

                showMessage('Prezzi aggiornati con successo!', 'success');
            } catch (err) {
                showMessage('Errore salvataggio: ' + err.message, 'error');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            setTimeout(() => { msg.className = 'message'; }, 3000);
        }

        // Carica prezzi all'avvio
        caricaPrezzi();
    </script>
</body>
</html>
