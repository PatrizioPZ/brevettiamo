<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elaborazione - BrevettIAmo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --pergamena: #F4EBE1;
  --pergamena-scura: #E8DCC8;
  --oro: #C5A059;
  --oro-scuro: #9A7B3D;
  --rosso: #A63A2B;
  --ferro: #4A4A4A;
  --ferro-chiaro: #6A6A6A;
  --bianco: #FAF8F5;
  --verde: #2D6A4F;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Lora', Georgia, serif;
  background: var(--pergamena);
  min-height: 100vh;
  color: var(--ferro);
}
.pergamena {
  max-width: 900px;
  margin: 40px auto;
  background: var(--bianco);
  border: 2px solid var(--oro);
  border-radius: 4px;
  box-shadow: 0 4px 20px rgba(26,26,26,0.15), inset 0 0 60px rgba(197,160,89,0.1);
  padding: 50px;
  position: relative;
}
.pergamena::before, .pergamena::after {
  content: '';
  position: absolute;
  left: 10px; right: 10px;
  height: 2px;
  background: var(--oro);
  opacity: 0.3;
}
.pergamena::before { top: 15px; }
.pergamena::after { bottom: 15px; }
.logo {
  text-align: center;
  margin-bottom: 30px;
}
.logo h1 {
  font-family: 'Cinzel', serif;
  font-size: 1.8rem;
  color: var(--rosso);
  letter-spacing: 2px;
}
.loading-container {
  text-align: center;
  padding: 60px 20px;
}
.loading-spinner {
  width: 80px;
  height: 80px;
  border: 4px solid var(--pergamena-scura);
  border-top: 4px solid var(--rosso);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 30px;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.loading-message {
  font-family: 'Cinzel', serif;
  font-size: 1.3rem;
  color: var(--rosso);
  margin-bottom: 15px;
}
.loading-submessage {
  font-style: italic;
  color: var(--ferro-chiaro);
  font-size: 0.95rem;
}
.stato-elaborazione {
  margin-top: 30px;
  padding: 20px;
  background: rgba(197,160,89,0.08);
  border: 1px solid var(--pergamena-scura);
  border-radius: 4px;
  text-align: left;
}
.stato-elaborazione h3 {
  font-family: 'Cinzel', serif;
  color: var(--rosso);
  font-size: 1rem;
  margin-bottom: 15px;
}
.stato-item {
  display: flex;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px dashed var(--pergamena-scura);
}
.stato-item:last-child { border-bottom: none; }
.stato-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  margin-right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: bold;
}
.stato-pending { background: var(--pergamena-scura); color: var(--bianco); }
.stato-active { background: var(--rosso); color: var(--bianco); animation: pulse 1.5s infinite; }
.stato-done { background: var(--verde); color: var(--bianco); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.stato-text { flex: 1; font-size: 0.9rem; }
.error-box {
  background: rgba(166,58,43,0.05);
  border: 1px dashed var(--rosso);
  border-radius: 4px;
  padding: 20px;
  margin-top: 20px;
  text-align: center;
}
.error-box h3 {
  font-family: 'Cinzel', serif;
  color: var(--rosso);
  margin-bottom: 10px;
}
.error-box p {
  color: var(--ferro-chiaro);
  font-size: 0.9rem;
}
.btn {
  font-family: 'Cinzel', serif;
  font-size: 0.95rem;
  letter-spacing: 2px;
  padding: 16px 40px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s;
  background: var(--oro);
  color: var(--bianco);
  box-shadow: 0 4px 15px rgba(197,160,89,0.3);
  margin-top: 20px;
}
.btn:hover {
  background: var(--oro-scuro);
  transform: translateY(-2px);
}
.hidden { display: none !important; }
.log-panel {
  background: var(--pergamena-scura);
  border: 1px solid var(--oro);
  border-radius: 4px;
  padding: 15px;
  max-height: 200px;
  overflow-y: auto;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  margin-top: 15px;
}
.log-entry { padding: 3px 0; border-bottom: 1px solid rgba(197,160,89,0.2); }
.log-info { color: var(--oro-scuro); }
.log-success { color: var(--verde); }
.log-error { color: var(--rosso); }
@media (max-width: 600px) {
  .pergamena { padding: 25px; margin: 20px; }
}
</style>
<base target="_blank">
</head>
<body>

<div class="pergamena">
  <div class="logo">
    <h1>ELABORAZIONE IN CORSO</h1>
  </div>

  <div id="loading-panel" class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-message" id="loading-message">Inizializzazione...</div>
    <div class="loading-submessage" id="loading-submessage">Connessione a Dual IA...</div>

    <div class="stato-elaborazione">
      <h3>Stato elaborazione</h3>
      <div id="stato-lista">
        <div class="stato-item">
          <div class="stato-icon stato-active" id="icon-1">1</div>
          <div class="stato-text" id="text-1">Connessione a Supabase</div>
        </div>
        <div class="stato-item">
          <div class="stato-icon stato-pending" id="icon-2">2</div>
          <div class="stato-text" id="text-2">Analisi Dual IA (Analitica)</div>
        </div>
        <div class="stato-item">
          <div class="stato-icon stato-pending" id="icon-3">3</div>
          <div class="stato-text" id="text-3">Verifica Dual IA (Critica)</div>
        </div>
        <div class="stato-item">
          <div class="stato-icon stato-pending" id="icon-4">4</div>
          <div class="stato-text" id="text-4">Finalizzazione risultato</div>
        </div>
      </div>
    </div>
    <div class="log-panel" id="log-panel"></div>
  </div>

  <div id="error-panel" class="error-box hidden">
    <h3>Si e verificato un errore</h3>
    <p id="error-message">Impossibile completare l elaborazione</p>
    <button class="btn" onclick="location.reload()">RIPROVA</button>
  </div>
</div>

<script>
// ==========================================
// ELABORAZIONE BREVETTIAMO - DUAL IA REALE
// Chiama call-ai-tavole-v5-slim su Supabase
// ==========================================

const SUPABASE_URL = 'https://jtekrvlmqnluvaiapmwb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_p9WH85YPfwtaKp4tfcDwug_Q9duausk';
const EDGE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/call-ai-tavole-v5-slim';

const servizioId = new URLSearchParams(window.location.search).get("servizio") || "servizio-deposito";
const descrizione = localStorage.getItem("brevettiamo_descrizione") || "";

function log(msg, type) {
  type = type || 'info';
  const panel = document.getElementById('log-panel');
  const time = new Date().toLocaleTimeString('it-IT');
  const colors = { info: 'log-info', success: 'log-success', error: 'log-error' };
  panel.innerHTML += '<div class="log-entry ' + (colors[type] || 'log-info') + '">[' + time + '] ' + msg + '</div>';
  panel.scrollTop = panel.scrollHeight;
}

function aggiornaStato(step, stato) {
  const icon = document.getElementById("icon-" + step);
  const text = document.getElementById("text-" + step);
  if (icon) {
    icon.className = 'stato-icon stato-' + stato;
    if (stato === 'done') icon.textContent = 'OK';
  }
  if (text && stato === 'active') {
    text.style.fontWeight = 'bold';
    text.style.color = '#8b0000';
  }
}

function mostraErrore(messaggio) {
  document.getElementById('loading-panel').classList.add('hidden');
  document.getElementById('error-panel').classList.remove('hidden');
  document.getElementById('error-message').textContent = messaggio;
}

async function avviaElaborazione() {
  console.log("[Elaborazione] Avvio per servizio: " + servizioId);
  console.log("[Elaborazione] Descrizione: " + descrizione.substring(0, 100));

  if (!descrizione) {
    mostraErrore("Nessuna descrizione trovata. Torna indietro e inserisci una descrizione.");
    return;
  }

  log('=== ELABORAZIONE DUAL IA ===', 'info');
  log('Servizio: ' + servizioId, 'info');
  log('Descrizione: ' + descrizione.substring(0, 80) + '...', 'info');

  // Mappa servizio ID -> nome servizio per Edge Function
  const servizioMap = {
    'servizio-deposito': 'deposito-brevetto',
    'servizio-prior-art': 'prior-art',
    'servizio-rivendicazioni': 'rivendicazioni',
    'servizio-tavole': 'tavole-tecniche',
    'servizio-cad': 'tavole-tecniche'
  };

  const servizio = servizioMap[servizioId] || 'deposito-brevetto';

  // Prepara payload
  const payload = {
    servizio: servizio,
    descrizione: descrizione,
    fase: 'completo',
    datiExtra: {
      tipoBrevetto: 'invenzione',
      settore: 'meccanica'
    },
    bypassCritica: false
  };

  log('Payload preparato', 'info');
  document.getElementById('loading-message').textContent = 'Connessione a Dual IA...';
  document.getElementById('loading-submessage').textContent = 'Invio richiesta a Supabase...';

  try {
    aggiornaStato(1, 'active');
    const startTime = Date.now();

    const response = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify(payload)
    });

    const elapsed = Date.now() - startTime;
    log('Risposta in ' + elapsed + 'ms - Status: ' + response.status, 'info');

    aggiornaStato(1, 'done');
    aggiornaStato(2, 'active');
    document.getElementById('loading-message').textContent = 'Analisi Dual IA...';
    document.getElementById('loading-submessage').textContent = 'Analitica in corso...';

    const data = await response.json();

    if (!response.ok) {
      throw new Error('HTTP ' + response.status + ': ' + (data.error || data.e || 'Errore'));
    }
    if (!data.success) {
      throw new Error(data.error || 'Elaborazione fallita');
    }

    log('Analisi completata', 'success');
    log('API Analitica: ' + (data.metadata?.apiAnalitica || 'N/A'), 'success');

    aggiornaStato(2, 'done');
    aggiornaStato(3, 'active');
    document.getElementById('loading-message').textContent = 'Verifica Dual IA...';
    document.getElementById('loading-submessage').textContent = 'Critica in corso...';

    log('Verifica completata', 'success');
    log('API Critica: ' + (data.metadata?.apiCritica || 'N/A'), 'success');

    aggiornaStato(3, 'done');
    aggiornaStato(4, 'active');
    document.getElementById('loading-message').textContent = 'Finalizzazione...';
    document.getElementById('loading-submessage').textContent = 'Salvataggio risultato...';

    // Salva risultato
    localStorage.setItem("brevettiamo_risultato", JSON.stringify(data));
    localStorage.setItem("brevettiamo_servizio", servizioId);

    log('Risultato salvato', 'success');
    aggiornaStato(4, 'done');

    document.getElementById('loading-message').textContent = 'Completato!';
    document.getElementById('loading-submessage').textContent = 'Reindirizzamento...';

    setTimeout(function() {
      window.location.href = "revisione.html?servizio=" + encodeURIComponent(servizioId);
    }, 1500);

  } catch (error) {
    console.error("[Elaborazione] Errore: " + error.message);
    log('ERRORE: ' + error.message, 'error');
    mostraErrore(error.message);
  }
}

// Avvia automaticamente
document.addEventListener("DOMContentLoaded", function() {
  setTimeout(avviaElaborazione, 500);
});
</script>

</body>
</html>
