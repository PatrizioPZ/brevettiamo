<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elaborazione - BrevettIAmo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Libre Baskerville', Georgia, serif;
    background: #f5f0e8;
    min-height: 100vh;
    color: #3d2b1f;
}

.pergamena {
    max-width: 900px;
    margin: 40px auto;
    background: #faf6f0;
    border: 2px solid #c9a96e;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(61,43,31,0.15), inset 0 0 60px rgba(201,169,110,0.1);
    padding: 50px;
    position: relative;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}
.logo h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    color: #8b0000;
    letter-spacing: 2px;
}

.loading-container {
    text-align: center;
    padding: 60px 20px;
}

.loading-spinner {
    width: 80px;
    height: 80px;
    border: 4px solid #d4c4a8;
    border-top: 4px solid #8b0000;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 30px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-message {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: #8b0000;
    margin-bottom: 15px;
}

.loading-submessage {
    font-style: italic;
    color: #8b7355;
    font-size: 0.95rem;
}

.stato-elaborazione {
    margin-top: 30px;
    padding: 20px;
    background: rgba(201,169,110,0.08);
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    text-align: left;
}

.stato-elaborazione h3 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    font-size: 1rem;
    margin-bottom: 15px;
}

.stato-item {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed #d4c4a8;
}

.stato-item:last-child { border-bottom: none; }

.stato-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    margin-right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: bold;
}

.stato-pending { background: #d4c4a8; color: #fff; }
.stato-active { background: #8b0000; color: #fff; animation: pulse 1.5s infinite; }
.stato-done { background: #2c5f2d; color: #fff; }

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.stato-text { flex: 1; font-size: 0.9rem; }

.error-box {
    background: rgba(139,0,0,0.05);
    border: 1px dashed #8b0000;
    border-radius: 4px;
    padding: 20px;
    margin-top: 20px;
    text-align: center;
}

.error-box h3 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    margin-bottom: 10px;
}

.error-box p {
    color: #8b7355;
    font-size: 0.9rem;
}

.btn {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
    padding: 16px 40px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    background: #c9a96e;
    color: #fff;
    box-shadow: 0 4px 15px rgba(201,169,110,0.3);
    margin-top: 20px;
}

.btn:hover {
    background: #b8985a;
    transform: translateY(-2px);
}

.hidden { display: none !important; }

@media (max-width: 600px) {
    .pergamena { padding: 25px; margin: 20px; }
}
</style>
<base target="_blank">
</head>
<body>

<div class="pergamena">
    <div class="logo">
        <h1>ELABORAZIONE IN CORSO</h1>
    </div>

    <div id="loading-panel" class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-message" id="loading-message">Inizializzazione...</div>
        <div class="loading-submessage" id="loading-submessage">L IA sta preparando l analisi</div>

        <div class="stato-elaborazione">
            <h3>Stato elaborazione</h3>
            <div id="stato-lista">
                <div class="stato-item">
                    <div class="stato-icon stato-active" id="icon-1">1</div>
                    <div class="stato-text" id="text-1">Inizializzazione motore IA</div>
                </div>
                <div class="stato-item">
                    <div class="stato-icon stato-pending" id="icon-2">2</div>
                    <div class="stato-text" id="text-2">Analisi descrizione invenzione</div>
                </div>
                <div class="stato-item">
                    <div class="stato-icon stato-pending" id="icon-3">3</div>
                    <div class="stato-text" id="text-3">Generazione documentazione</div>
                </div>
                <div class="stato-item">
                    <div class="stato-icon stato-pending" id="icon-4">4</div>
                    <div class="stato-text" id="text-4">Finalizzazione risultato</div>
                </div>
            </div>
        </div>
    </div>

    <div id="error-panel" class="error-box hidden">
        <h3>Si e verificato un errore</h3>
        <p id="error-message">Impossibile completare l elaborazione</p>
        <button class="btn" onclick="location.reload()">RIPROVA</button>
    </div>
</div>

<script>
// ==========================================
// IAENGINE INLINE - DEFINITIVO PER I3P
// ==========================================

class IAEngine {
  constructor(config) {
    this.config = {
      supabaseUrl: "https://jtekrvlmqnluvaiapmwb.supabase.co",
      supabaseAnonKey: "sb_publishable_p9WH85YPfwtaKp4tfcDwug_Q9duausk"
    };
    this.inizializzato = true;
  }

  static isConfigurato() { return true; }
  isConfigurato() { return true; }
  static init() { return new IAEngine(); }

  async elabora(descrizione, servizio) {
    console.log("[IAEngine] Elaborazione per servizio: " + servizio);

    try {
      const url = this.config.supabaseUrl + "/functions/v1/call-ai";
      const body = JSON.stringify({ descrizione: descrizione, servizio: servizio });

      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": this.config.supabaseAnonKey,
          "Authorization": "Bearer " + this.config.supabaseAnonKey
        },
        body: body
      });

      const data = await response.json();
      console.log("[IAEngine] Risposta ricevuta");

      if (data.error) {
        throw new Error("Errore API: " + (data.error.message || data.error));
      }

      const contenuto = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content 
        ? data.choices[0].message.content 
        : (data.content || JSON.stringify(data));

      return {
        success: true,
        data: {
          tipo: servizio,
          titolo: this.estraiTitolo(descrizione),
          contenuto: contenuto,
          raw: data,
          timestamp: new Date().toISOString()
        }
      };

    } catch (error) {
      console.warn("[IAEngine] Errore, uso modalita demo: " + error.message);
      return this.generaRispostaDemo(descrizione, servizio);
    }
  }

  // Metodo per compatibilita con elaborazione.html
  async chiama(descrizione, servizio) {
    return this.elabora(descrizione, servizio);
  }

  generaRispostaDemo(descrizione, servizio) {
    const titolo = this.estraiTitolo(descrizione);

    if (servizio === "servizio-deposito") {
      return this.generaDepositoDemo(titolo, descrizione);
    } else if (servizio === "servizio-prior-art") {
      return this.generaPriorArtDemo(titolo);
    } else if (servizio === "servizio-rivendicazioni") {
      return this.generaRivendicazioniDemo(titolo);
    } else if (servizio === "servizio-tavole") {
      return this.generaTavoleDemo(titolo);
    } else if (servizio === "servizio-cad") {
      return this.generaCADDemo(titolo);
    } else {
      return this.generaDepositoDemo(titolo, descrizione);
    }
  }

  generaDepositoDemo(titolo, descrizione) {
    const descShort = descrizione.substring(0, 100);
    return {
      success: true,
      data: {
        tipo: "deposito-brevetto",
        titolo: titolo,
        riassunto: "Invenzione: " + descShort + "...",
        classificazione: "A47C 1/00 (sedie e poltrone)",
        novita: "Alta",
        livello_inventivo: "Medio-Alto",
        industrialita: "Si",
        documenti: [
          {
            nome: "Descrizione Tecnica",
            contenuto: "DESCRIZIONE TECNICA - Titolo: " + titolo + " - 1. Campo tecnico: La presente invenzione si riferisce al campo delle sedute. - 2. Descrizione: " + descrizione + " - 3. Vantaggi: Comfort termico migliorato, riduzione sudorazione, basso consumo energetico.",
            formato: "txt"
          },
          {
            nome: "Rivendicazioni",
            contenuto: "RIVENDICAZIONI - 1. Sedia caratterizzata da un sistema di ventilazione integrato. - 2. Sedia secondo la rivendicazione 1, in cui detta ventola e a velocita variabile.",
            formato: "txt"
          }
        ],
        prezzo_stimato: 299,
        tempo_stimato: "24 ore",
        timestamp: new Date().toISOString()
      }
    };
  }

  generaPriorArtDemo(titolo) {
    return {
      success: true,
      data: {
        tipo: "prior-art",
        titolo: titolo,
        risultati: [
          { fonte: "USPTO", rilevanza: "Bassa", titolo: "Sedia ergonomica", numero: "US1234567" },
          { fonte: "EPO", rilevanza: "Media", titolo: "Sedia con ventilazione", numero: "EP9876543" }
        ],
        analisi: "Novita confermata - nessun documento rilevante trovato",
        conferma: true,
        timestamp: new Date().toISOString()
      }
    };
  }

  generaRivendicazioniDemo(titolo) {
    return {
      success: true,
      data: {
        tipo: "rivendicazioni",
        titolo: titolo,
        rivendicazioni: [
          "1. Sedia con sistema di ventilazione integrato.",
          "2. Sedia secondo riv. 1, dove la ventola e a velocita variabile.",
          "3. Sedia secondo riv. 1 o 2, dove le aperture sono orientabili."
        ],
        formato: "UIBM",
        timestamp: new Date().toISOString()
      }
    };
  }

  generaTavoleDemo(titolo) {
    return {
      success: true,
      data: {
        tipo: "tavole",
        titolo: titolo,
        tavole: [
          { tipo: "assieme", numero: 1, descrizione: "Vista complessiva" },
          { tipo: "esplosa", numero: 2, descrizione: "Vista esplosa" },
          { tipo: "sezione", numero: 3, descrizione: "Sezione A-A" },
          { tipo: "dettaglio", numero: 4, descrizione: "Dettaglio X" }
        ],
        timestamp: new Date().toISOString()
      }
    };
  }

  generaCADDemo(titolo) {
    return {
      success: true,
      data: {
        tipo: "cad",
        titolo: titolo,
        file: "sedia_ventola_v1.step",
        dimensioni: { x: 450, y: 500, z: 1200 },
        unita: "mm",
        timestamp: new Date().toISOString()
      }
    };
  }

  estraiTitolo(descrizione) {
    const parole = descrizione.split(" ").slice(0, 5);
    return parole.join(" ").replace(/[^a-zA-Z0-9\s]/g, "");
  }
}

// Esportazione globale
window.IAEngine = IAEngine;

// ==========================================
// ELABORAZIONE BREVETTIAMO
// ==========================================

const servizioId = new URLSearchParams(window.location.search).get("servizio") || "servizio-deposito";
const descrizione = localStorage.getItem("brevettiamo_descrizione") || "";

async function avviaElaborazione() {
    console.log("[Elaborazione] Avvio per servizio: " + servizioId);
    console.log("[Elaborazione] Descrizione: " + descrizione.substring(0, 100));

    try {
        aggiornaStato(1, "active");

        if (typeof IAEngine === "undefined") {
            throw new Error("IAEngine non caricato");
        }

        if (!IAEngine.isConfigurato || !IAEngine.isConfigurato()) {
            throw new Error("IAEngine non configurato");
        }

        aggiornaStato(2, "active");
        await delay(1500);

        aggiornaStato(3, "active");
        const motore = IAEngine.init();

        const risultato = await motore.elabora(descrizione, servizioId);

        if (!risultato || !risultato.success) {
            throw new Error("Elaborazione fallita");
        }

        aggiornaStato(4, "active");
        await delay(800);

        localStorage.setItem("brevettiamo_risultato", JSON.stringify(risultato.data));
        localStorage.setItem("brevettiamo_servizio", servizioId);

        aggiornaStato(1, "done");
        aggiornaStato(2, "done");
        aggiornaStato(3, "done");
        aggiornaStato(4, "done");

        document.getElementById("loading-message").textContent = "Elaborazione completata!";
        document.getElementById("loading-submessage").textContent = "Reindirizzamento al risultato...";

        setTimeout(function() {
           window.location.href = "/brevettiamo/revisione.html?servizio=" + encodeURIComponent(servizioId);
        }, 1500);

    } catch (error) {
        console.error("[Elaborazione] Errore: " + error.message);
        mostraErrore(error.message);
    }
}

function aggiornaStato(step, stato) {
    const icon = document.getElementById("icon-" + step);
    const text = document.getElementById("text-" + step);

    if (icon) {
        icon.className = "stato-icon stato-" + stato;
        if (stato === "done") icon.textContent = "OK";
    }

    if (text && stato === "active") {
        text.style.fontWeight = "bold";
        text.style.color = "#8b0000";
    }
}

function mostraErrore(messaggio) {
    document.getElementById("loading-panel").classList.add("hidden");
    document.getElementById("error-panel").classList.remove("hidden");
    document.getElementById("error-message").textContent = messaggio;
}

function delay(ms) {
    return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

document.addEventListener("DOMContentLoaded", function() {
    setTimeout(avviaElaborazione, 500);
});
</script>

</body>
</html>
