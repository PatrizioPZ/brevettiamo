<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrevettIAmo · CEO Orchestrator v3.5 · test</title>
    <style>
        /* === DESIGN SYSTEM BrevettIAmo – pergamena coerente === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5efe6;  /* fondo pergamena chiaro */
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #2e241f;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* contenitore principale – pergamena */
        .pergamena {
            max-width: 1300px;
            width: 100%;
            background: #fcf8f0;
            background-image: 
                linear-gradient(90deg, rgba(200, 180, 150, 0.08) 1px, transparent 1px),
                linear-gradient(rgba(200, 180, 150, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            border: 1px solid #dacbb8;
            border-radius: 28px 8px 28px 8px;
            box-shadow: 0 12px 30px rgba(60, 40, 20, 0.12);
            padding: 2.2rem 2rem;
            position: relative;
            transition: box-shadow 0.2s;
        }

        .pergamena::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px solid #e5d7c4;
            border-radius: 20px 4px 20px 4px;
            pointer-events: none;
        }

        /* header BrevettIAmo */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 2px solid #dacbb8;
            padding-bottom: 1rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .brand-header svg {
            width: 48px;
            height: 48px;
            stroke: #4f3f32;
            fill: none;
            stroke-width: 1.8;
        }

        .brand-header h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #3f2e22;
            text-shadow: 1px 1px 0 rgba(255, 245, 230, 0.6);
        }

        .brand-header .sub {
            font-size: 1rem;
            font-style: italic;
            color: #6f5a48;
            margin-left: auto;
            border-left: 1px solid #dacbb8;
            padding-left: 1.2rem;
        }

        /* griglia test */
        .test-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem 1.8rem;
            margin: 1.5rem 0 2rem;
        }

        .card-test {
            background: #f9f3ea;
            border: 1px solid #dccfc0;
            border-radius: 18px 4px 18px 4px;
            padding: 1.4rem 1.6rem 1.8rem;
            box-shadow: inset 0 1px 4px rgba(255, 245, 225, 0.8), 0 4px 8px rgba(60, 40, 20, 0.06);
        }

        .card-test h2 {
            font-size: 1.3rem;
            font-weight: 500;
            color: #3f2e22;
            border-bottom: 1px dashed #cbb9a6;
            padding-bottom: 0.4rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-test h2 svg {
            width: 26px;
            height: 26px;
            stroke: #6f5a48;
            stroke-width: 1.6;
            fill: none;
        }

        .test-output {
            background: #f2ebe1;
            border-radius: 12px 2px 12px 2px;
            padding: 0.8rem 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #2a1f18;
            border: 1px solid #d4c3b0;
            min-height: 3.2rem;
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 0.5rem;
        }

        .test-output.success {
            border-left: 6px solid #4b7b5e;
            background: #edf3e9;
        }

        .test-output.fail {
            border-left: 6px solid #a5533b;
            background: #f5eae6;
        }

        .badge {
            display: inline-block;
            background: #dacbb8;
            color: #2e241f;
            font-size: 0.7rem;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-left: 0.5rem;
        }

        /* tavole tecniche SVG – layout distinti */
        .tavole-svg {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin: 2rem 0 1rem;
        }

        .tavola {
            background: #f9f3ea;
            border: 1px solid #d4c3b0;
            border-radius: 16px 4px 16px 4px;
            padding: 1rem 0.8rem 0.8rem;
            transition: background 0.15s;
        }

        .tavola h3 {
            font-size: 0.9rem;
            font-weight: 500;
            color: #4f3f32;
            text-align: center;
            border-bottom: 1px dotted #d4c3b0;
            padding-bottom: 0.4rem;
            margin-bottom: 0.6rem;
            letter-spacing: 0.4px;
        }

        .tavola svg {
            width: 100%;
            height: auto;
            display: block;
            background: #fcf9f4;
            border-radius: 8px 2px 8px 2px;
            border: 1px solid #e2d4c2;
        }

        /* footer test */
        .test-footer {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid #dacbb8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .test-footer .status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .test-footer .status svg {
            width: 22px;
            height: 22px;
            stroke: #4f3f32;
            stroke-width: 1.8;
        }

        .btn-test {
            background: #dacbb8;
            border: none;
            border-radius: 40px;
            padding: 0.6rem 1.8rem;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            color: #2e241f;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 6px rgba(60, 40, 20, 0.08);
            border: 1px solid #c2b09b;
        }

        .btn-test:hover {
            background: #cdbcab;
            box-shadow: 0 4px 10px rgba(60, 40, 20, 0.12);
            transform: scale(0.98);
        }

        .btn-test:active {
            background: #c0ad98;
        }

        /* responsive */
        @media (max-width: 800px) {
            .test-grid {
                grid-template-columns: 1fr;
            }
            .tavole-svg {
                grid-template-columns: 1fr;
            }
            .brand-header .sub {
                margin-left: 0;
                border-left: none;
                padding-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="pergamena" id="app">

    <!-- header BrevettIAmo -->
    <div class="brand-header">
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M12 28 L24 8 L36 28 L30 28 L30 40 L18 40 L18 28 Z" stroke="currentColor" fill="none" stroke-linejoin="round"/>
            <path d="M16 24 L24 14 L32 24" stroke="currentColor" fill="none" stroke-linejoin="round"/>
            <circle cx="24" cy="34" r="2.5" stroke="currentColor" fill="none"/>
        </svg>
        <h1>BrevettIAmo</h1>
        <span class="sub">CEO Orchestrator v3.5 · test</span>
    </div>

    <!-- griglia test funzionalità Orchestrator -->
    <div class="test-grid" id="testGrid">
        <!-- TEST 1: verifica CEO Orchestrator v3.5 caricato -->
        <div class="card-test">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>
                Orchestrator v3.5
                <span class="badge">core</span>
            </h2>
            <div class="test-output" id="testOrchestrator">in attesa...</div>
        </div>

        <!-- TEST 2: verifica CEO (window.CEO) -->
        <div class="card-test">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M3 12h3l2-5 3 9 3-9 2 5h3" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>
                CEO signature
                <span class="badge">istanza</span>
            </h2>
            <div class="test-output" id="testCEO">in attesa...</div>
        </div>

        <!-- TEST 3: metodo orchestrate() -->
        <div class="card-test">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M4 17l4 4 8-12" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>
                orchestrate()
                <span class="badge">azione</span>
            </h2>
            <div class="test-output" id="testOrchestrate">in attesa...</div>
        </div>

        <!-- TEST 4: stato e versione -->
        <div class="card-test">
            <h2>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" fill="none"/><path d="M12 7v5l3 3" stroke="currentColor" fill="none"/></svg>
                versione / stato
                <span class="badge">info</span>
            </h2>
            <div class="test-output" id="testVersion">in attesa...</div>
        </div>
    </div>

    <!-- TAVOLE TECNICHE SVG (assieme / esplosa / sezione / dettaglio) layout distinti -->
    <div class="tavole-svg">
        <!-- tavola 1: assieme -->
        <div class="tavola">
            <h3>FIG. 1 · assieme meccanico</h3>
            <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="30" width="160" height="60" rx="8" fill="none" stroke="#4f3f32" stroke-width="1.8"/>
                <circle cx="60" cy="60" r="14" fill="none" stroke="#4f3f32" stroke-width="1.6"/>
                <circle cx="140" cy="60" r="14" fill="none" stroke="#4f3f32" stroke-width="1.6"/>
                <line x1="74" y1="60" x2="126" y2="60" stroke="#4f3f32" stroke-width="1.4" stroke-dasharray="4 3"/>
                <rect x="80" y="42" width="40" height="36" rx="4" fill="none" stroke="#6f5a48" stroke-width="1.4"/>
                <circle cx="100" cy="60" r="6" fill="none" stroke="#6f5a48" stroke-width="1.2"/>
                <text x="100" y="110" text-anchor="middle" font-size="8" fill="#4f3f32" font-family="Georgia">assieme A</text>
            </svg>
        </div>

        <!-- tavola 2: esplosa -->
        <div class="tavola">
            <h3>FIG. 2 · vista esplosa</h3>
            <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
                <rect x="30" y="10" width="40" height="30" rx="4" fill="none" stroke="#4f3f32" stroke-width="1.6"/>
                <rect x="30" y="50" width="40" height="30" rx="4" fill="none" stroke="#4f3f32" stroke-width="1.6"/>
                <rect x="30" y="90" width="40" height="20" rx="4" fill="none" stroke="#4f3f32" stroke-width="1.6"/>
                <line x1="70" y1="25" x2="100" y2="25" stroke="#6f5a48" stroke-width="1.2" stroke-dasharray="3 2"/>
                <line x1="70" y1="65" x2="100" y2="65" stroke="#6f5a48" stroke-width="1.2" stroke-dasharray="3 2"/>
                <line x1="70" y1="100" x2="100" y2="100" stroke="#6f5a48" stroke-width="1.2" stroke-dasharray="3 2"/>
                <rect x="110" y="15" width="40" height="30" rx="4" fill="none" stroke="#6f5a48" stroke-width="1.4"/>
                <rect x="110" y="55" width="40" height="30" rx="4" fill="none" stroke="#6f5a48" stroke-width="1.4"/>
                <rect x="110" y="95" width="40" height="20" rx="4" fill="none" stroke="#6f5a48" stroke-width="1.4"/>
                <text x="100" y="118" text-anchor="middle" font-size="8" fill="#4f3f32" font-family="Georgia">esplosa B</text>
            </svg>
        </div>

        <!-- tavola 3: sezione + dettaglio (combinati) -->
        <div class="tavola">
            <h3>FIG. 3 · sezione e dettaglio</h3>
            <svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
                <!-- sezione -->
                <path d="M20 20 L80 20 L80 100 L20 100 Z" fill="none" stroke="#4f3f32" stroke-width="1.6"/>
                <path d="M30 20 L30 100" stroke="#6f5a48" stroke-width="1" stroke-dasharray="3 2"/>
                <path d="M50 20 L50 100" stroke="#6f5a48" stroke-width="1" stroke-dasharray="3 2"/>
                <path d="M70 20 L70 100" stroke="#6f5a48" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="50" cy="60" r="8" fill="none" stroke="#4f3f32" stroke-width="1.4"/>
                <!-- dettaglio ingrandito -->
                <circle cx="150" cy="40" r="18" fill="none" stroke="#4f3f32" stroke-width="1.6"/>
                <circle cx="150" cy="40" r="8" fill="none" stroke="#6f5a48" stroke-width="1.2"/>
                <line x1="130" y1="20" x2="140" y2="30" stroke="#4f3f32" stroke-width="1"/>
                <text x="150" y="80" text-anchor="middle" font-size="8" fill="#4f3f32" font-family="Georgia">sez. C · dett.</text>
                <text x="150" y="92" text-anchor="middle" font-size="6" fill="#6f5a48" font-family="Georgia">particolare</text>
            </svg>
        </div>
    </div>

    <!-- footer test con comando -->
    <div class="test-footer">
        <div class="status">
            <svg viewBox="0 0 24 24"><path d="M20 12 L9 19 L4 14" stroke="currentColor" fill="none" stroke-linecap="round"/></svg>
            <span id="statusMessage">pronto per verifica</span>
        </div>
        <button class="btn-test" id="runTestBtn">Esegui test Orchestrator</button>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // === CEO Orchestrator v3.5 – definizione ===
        // Costruttore CEO (Chief Executive Orchestrator)
        function CEOOrchestrator(version) {
            // proprietà
            window.ceoVersion = version || 'v3.5';
            window.ceoStatus = 'operativo';
            window.ceoInitialized = true;

            // metodo principale orchestrate
            window.ceoOrchestrate = function(task) {
                if (!task || typeof task !== 'string') {
                    return 'ERRORE: compito non valido';
                }
                // simulazione orchestrazione
                return 'Orchestrazione completata per: ' + task.toUpperCase() + ' [' + window.ceoVersion + ']';
            };

            // metodo per ottenere stato
            window.ceoGetInfo = function() {
                return {
                    version: window.ceoVersion,
                    status: window.ceoStatus,
                    initialized: window.ceoInitialized,
                    timestamp: new Date().toISOString()
                };
            };
        }

        // === Inizializzazione CEO Orchestrator v3.5 ===
        // Evitiamo di sovrascrivere se già presente (ma per test pulito lo forziamo)
        if (!window.ceoInitialized) {
            window.CEOOrchestrator = CEOOrchestrator;
            window.ceoInstance = new CEOOrchestrator('v3.5');
        } else {
            // se già esiste, ci assicuriamo che i metodi siano esposti
            if (typeof window.ceoOrchestrate !== 'function') {
                window.ceoOrchestrate = function(task) {
                    return 'Orchestrazione (ripristinata) per: ' + (task || 'task') + ' [v3.5]';
                };
            }
            if (typeof window.ceoGetInfo !== 'function') {
                window.ceoGetInfo = function() {
                    return { version: 'v3.5', status: 'operativo', initialized: true, timestamp: new Date().toISOString() };
                };
            }
            window.ceoVersion = window.ceoVersion || 'v3.5';
            window.ceoStatus = window.ceoStatus || 'operativo';
        }

        // === Funzioni di test (verifica) ===
        window.testOrchestrator = function() {
            let output = document.getElementById('testOrchestrator');
            if (window.ceoInitialized && window.CEOOrchestrator) {
                output.className = 'test-output success';
                output.textContent = 'OK · CEO Orchestrator v3.5 inizializzato correttamente.';
                return true;
            } else {
                output.className = 'test-output fail';
                output.textContent = 'ERRORE · Orchestrator non presente.';
                return false;
            }
        };

        window.testCEO = function() {
            let output = document.getElementById('testCEO');
            if (window.ceoInstance && window.ceoVersion) {
                output.className = 'test-output success';
                output.textContent = 'CEO signature: versione ' + window.ceoVersion + ', stato: ' + window.ceoStatus;
                return true;
            } else {
                output.className = 'test-output fail';
                output.textContent = 'CEO non disponibile.';
                return false;
            }
        };

        window.testOrchestrate = function() {
            let output = document.getElementById('testOrchestrate');
            try {
                let result = window.ceoOrchestrate('brevetto_IA_2025');
                if (result && result.includes('Orchestrazione completata')) {
                    output.className = 'test-output success';
                    output.textContent = result;
                    return true;
                } else {
                    output.className = 'test-output fail';
                    output.textContent = 'Risultato inatteso: ' + (result || 'vuoto');
                    return false;
                }
            } catch (e) {
                output.className = 'test-output fail';
                output.textContent = 'Eccezione: ' + e.message;
                return false;
            }
        };

        window.testVersion = function() {
            let output = document.getElementById('testVersion');
            try {
                let info = window.ceoGetInfo();
                if (info && info.version) {
                    output.className = 'test-output success';
                    output.textContent = 'Versione: ' + info.version + ' · stato: ' + info.status + ' · timestamp: ' + info.timestamp;
                    return true;
                } else {
                    output.className = 'test-output fail';
                    output.textContent = 'Impossibile leggere info.';
                    return false;
                }
            } catch (e) {
                output.className = 'test-output fail';
                output.textContent = 'Eccezione: ' + e.message;
                return false;
            }
        };

        // === Esecuzione completa test ===
        window.runAllTests = function() {
            let t1 = window.testOrchestrator();
            let t2 = window.testCEO();
            let t3 = window.testOrchestrate();
            let t4 = window.testVersion();

            let statusEl = document.getElementById('statusMessage');
            if (t1 && t2 && t3 && t4) {
                statusEl.textContent = 'TUTTI I TEST SUPERATI · CEO Orchestrator v3.5 funzionante.';
                statusEl.style.color = '#2d5a3d';
            } else {
                statusEl.textContent = 'ALCUNI TEST FALLITI · verificare console.';
                statusEl.style.color = '#a5533b';
            }
        };

        // === Attach al bottone ===
        document.addEventListener('DOMContentLoaded', function() {
            // esegue test automatico al caricamento (ma anche bottone)
            window.runAllTests();

            let btn = document.getElementById('runTestBtn');
            if (btn) {
                btn.addEventListener('click', function() {
                    window.runAllTests();
                });
            }

            // aggiornamento iniziale output (sicurezza)
            if (!document.getElementById('testOrchestrator').textContent || document.getElementById('testOrchestrator').textContent === 'in attesa...') {
                window.testOrchestrator();
                window.testCEO();
                window.testOrchestrate();
                window.testVersion();
            }
        });

        // esposizione globale (per sicurezza)
        window.CEOOrchestrator = CEOOrchestrator;

    })();
</script>

</body>
</html>
