<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrevettIAmo · CEO Orchestrator v3.5 · test</title>
    <!-- Design System BrevettIAmo: pergamena, oro, bordo, eleganza -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2b1e0f; /* fondo scuro legno */
            font-family: 'Palatino', 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* pergamena principale */
        .pergamena {
            max-width: 1300px;
            width: 100%;
            background: #fcf3e0;
            background-image: 
                linear-gradient(145deg, rgba(210, 180, 120, 0.15) 0%, rgba(245, 225, 180, 0.3) 100%),
                repeating-linear-gradient(45deg, rgba(200, 170, 110, 0.05) 0px, rgba(200, 170, 110, 0.05) 4px, transparent 4px, transparent 12px);
            border: 12px double #b48c4c;
            border-radius: 32px 8px 32px 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 0 0 2px #e9d6b0;
            padding: 2.5rem 2rem;
            position: relative;
            transition: all 0.2s ease;
        }

        .pergamena::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px solid #c9ad7a;
            border-radius: 20px 4px 20px 4px;
            pointer-events: none;
        }

        /* header con sigillo */
        .sigillo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #b48c4c;
            padding-bottom: 1.2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .sigillo-titolo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sigillo-titolo svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: #7a5c2e;
            stroke-width: 1.8;
        }

        .sigillo-titolo h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #3f2b15;
            text-shadow: 1px 1px 0 #dac29c;
        }

        .sigillo-titolo h1 small {
            font-size: 1rem;
            font-weight: 400;
            display: block;
            letter-spacing: 3px;
            color: #7a5c2e;
            margin-top: 0.2rem;
        }

        .badge-versione {
            background: #b48c4c;
            color: #fcf3e0;
            padding: 0.5rem 1.8rem;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid #e9d6b0;
            box-shadow: inset 0 1px 3px rgba(255,215,140,0.6);
        }

        /* griglia test */
        .test-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin: 2rem 0 1.5rem;
        }

        @media (max-width: 800px) {
            .test-grid {
                grid-template-columns: 1fr;
            }
        }

        .test-card {
            background: rgba(255, 245, 225, 0.6);
            backdrop-filter: blur(1px);
            border: 1px solid #dac29c;
            border-radius: 24px 6px 24px 6px;
            padding: 1.6rem 1.8rem;
            box-shadow: 0 6px 14px rgba(60, 40, 20, 0.2);
        }

        .test-card h2 {
            font-size: 1.5rem;
            color: #3f2b15;
            border-left: 6px solid #b48c4c;
            padding-left: 1rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .test-card h2 svg {
            width: 28px;
            height: 28px;
            stroke: #7a5c2e;
            stroke-width: 1.5;
        }

        .test-output {
            background: #f5ead6;
            border: 1px solid #c9ad7a;
            border-radius: 16px 4px 16px 4px;
            padding: 1rem 1.2rem;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: #2b1e0f;
            min-height: 80px;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
            margin-top: 0.8rem;
        }

        .test-output.ok {
            border-left: 6px solid #4a7a4c;
        }

        .test-output.fail {
            border-left: 6px solid #a13d3d;
        }

        .test-output.pending {
            border-left: 6px solid #b48c4c;
        }

        .btn-test {
            background: #b48c4c;
            border: none;
            border-radius: 40px;
            padding: 0.7rem 2rem;
            font-family: 'Palatino', serif;
            font-weight: bold;
            font-size: 1.1rem;
            color: #fcf3e0;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 0 #6f4f2a;
            transition: 0.1s linear;
            margin-top: 1rem;
            border: 1px solid #e9d6b0;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .btn-test:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #6f4f2a;
        }

        .btn-test svg {
            width: 22px;
            height: 22px;
            stroke: #fcf3e0;
            stroke-width: 2;
        }

        .footer-test {
            margin-top: 2rem;
            border-top: 1px dashed #b48c4c;
            padding-top: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            color: #4f3a1f;
        }

        .stato-globale {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .stato-globale span {
            background: #b48c4c;
            color: #fcf3e0;
            padding: 0.2rem 1.2rem;
            border-radius: 30px;
            margin-left: 0.5rem;
        }

        /* tavole SVG tecniche */
        .tavole-svg {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            justify-content: center;
            margin: 2.5rem 0 1rem;
        }

        .tavola {
            background: #faf1df;
            border: 1px solid #b48c4c;
            border-radius: 20px 4px 20px 4px;
            padding: 1rem 1rem 0.8rem;
            box-shadow: inset 0 0 0 2px #efe2c6;
            flex: 1 1 180px;
            min-width: 150px;
            text-align: center;
        }

        .tavola svg {
            width: 100%;
            height: auto;
            max-height: 130px;
            display: block;
            margin: 0 auto;
        }

        .tavola figcaption {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #3f2b15;
            letter-spacing: 0.5px;
            border-top: 1px dotted #c9ad7a;
            padding-top: 0.4rem;
        }

        .dettaglio-icon {
            stroke: #7a5c2e;
            stroke-width: 1.8;
            fill: none;
        }

        .fill-soft {
            fill: #dac29c;
            stroke: #7a5c2e;
            stroke-width: 1.2;
        }

        .fill-chiaro {
            fill: #efe2c6;
        }

        .linea-oro {
            stroke: #b48c4c;
            stroke-width: 2;
        }
    </style>
</head>
<body>
<div class="pergamena" id="pergamenaCEO">

    <!-- Sigillo -->
    <div class="sigillo">
        <div class="sigillo-titolo">
            <!-- SVG bilancia/brevetto -->
            <svg viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="20" stroke="#7a5c2e" stroke-width="1.8" fill="none"/>
                <path d="M16 18 L24 12 L32 18" stroke="#7a5c2e" stroke-width="2" fill="none"/>
                <path d="M20 22 L24 18 L28 22" stroke="#7a5c2e" stroke-width="1.5" fill="none"/>
                <rect x="21" y="24" width="6" height="10" stroke="#7a5c2e" stroke-width="1.5" fill="none"/>
                <path d="M18 34 L30 34" stroke="#7a5c2e" stroke-width="2"/>
                <circle cx="24" cy="34" r="2" fill="#7a5c2e"/>
            </svg>
            <h1>BrevettIAmo <small>CEO Orchestrator</small></h1>
        </div>
        <div class="badge-versione">v3.5 · test</div>
    </div>

    <!-- Test grid: 4 moduli -->
    <div class="test-grid">
        <!-- 1. Verifica CEO Orchestrator boot -->
        <div class="test-card">
            <h2>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 8v4l3 3" stroke="currentColor" stroke-width="1.8"/></svg>
                Boot CEO
            </h2>
            <div class="test-output pending" id="outputBoot">⏳ inizializzazione...</div>
        </div>

        <!-- 2. Verifica firma brevettuale -->
        <div class="test-card">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h10" stroke="currentColor" stroke-width="1.8" fill="none"/><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
                Firma brevettuale
            </h2>
            <div class="test-output pending" id="outputFirma">⏳ verifica firma...</div>
        </div>

        <!-- 3. Tavole tecniche SVG (assieme, esplosa, sezione, dettaglio) -->
        <div class="test-card" style="grid-column: span 1;">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M9 9h6v6H9z" stroke="currentColor" stroke-width="1.5"/></svg>
                Tavole SVG
            </h2>
            <div class="tavole-svg" style="margin:0.2rem 0;">
                <!-- assieme -->
                <div class="tavola">
                    <svg viewBox="0 0 80 60">
                        <rect x="10" y="10" width="60" height="40" rx="6" class="fill-soft" stroke-width="1.8"/>
                        <rect x="20" y="18" width="40" height="24" rx="3" fill="none" class="linea-oro"/>
                        <circle cx="40" cy="30" r="6" fill="#b48c4c" stroke="#3f2b15" stroke-width="1.2"/>
                        <line x1="10" y1="10" x2="20" y2="18" stroke="#7a5c2e" stroke-width="1.2" stroke-dasharray="2 2"/>
                        <line x1="70" y1="10" x2="60" y2="18" stroke="#7a5c2e" stroke-width="1.2" stroke-dasharray="2 2"/>
                    </svg>
                    <figcaption>assieme</figcaption>
                </div>
                <!-- esplosa -->
                <div class="tavola">
                    <svg viewBox="0 0 80 60">
                        <rect x="5" y="5" width="20" height="14" rx="3" class="fill-chiaro" stroke="#7a5c2e" stroke-width="1.5"/>
                        <rect x="30" y="20" width="20" height="14" rx="3" class="fill-chiaro" stroke="#7a5c2e" stroke-width="1.5"/>
                        <rect x="55" y="35" width="20" height="14" rx="3" class="fill-chiaro" stroke="#7a5c2e" stroke-width="1.5"/>
                        <line x1="25" y1="12" x2="30" y2="27" stroke="#b48c4c" stroke-width="1.5" stroke-dasharray="3 2"/>
                        <line x1="50" y1="27" x2="55" y2="42" stroke="#b48c4c" stroke-width="1.5" stroke-dasharray="3 2"/>
                    </svg>
                    <figcaption>esplosa</figcaption>
                </div>
                <!-- sezione -->
                <div class="tavola">
                    <svg viewBox="0 0 80 60">
                        <path d="M10 10 L70 10 L70 50 L10 50 Z" fill="#efe2c6" stroke="#7a5c2e" stroke-width="1.5"/>
                        <path d="M20 10 L20 50" stroke="#b48c4c" stroke-width="2" stroke-dasharray="4 2"/>
                        <path d="M40 10 L40 50" stroke="#b48c4c" stroke-width="2" stroke-dasharray="4 2"/>
                        <path d="M60 10 L60 50" stroke="#b48c4c" stroke-width="2" stroke-dasharray="4 2"/>
                        <line x1="10" y1="30" x2="70" y2="30" stroke="#7a5c2e" stroke-width="1.2" stroke-dasharray="2 2"/>
                        <circle cx="30" cy="30" r="3" fill="#b48c4c"/>
                        <circle cx="50" cy="30" r="3" fill="#b48c4c"/>
                    </svg>
                    <figcaption>sezione</figcaption>
                </div>
                <!-- dettaglio -->
                <div class="tavola">
                    <svg viewBox="0 0 80 60">
                        <circle cx="40" cy="30" r="22" fill="none" stroke="#7a5c2e" stroke-width="1.8"/>
                        <circle cx="40" cy="30" r="10" fill="none" stroke="#b48c4c" stroke-width="2"/>
                        <circle cx="40" cy="30" r="4" fill="#b48c4c"/>
                        <line x1="18" y1="18" x2="30" y2="24" stroke="#7a5c2e" stroke-width="1.2"/>
                        <line x1="62" y1="18" x2="50" y2="24" stroke="#7a5c2e" stroke-width="1.2"/>
                        <path d="M25 45 L40 38 L55 45" stroke="#b48c4c" stroke-width="1.8" fill="none"/>
                    </svg>
                    <figcaption>dettaglio</figcaption>
                </div>
            </div>
        </div>

        <!-- 4. Verifica integrità design system -->
        <div class="test-card">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
                Design System
            </h2>
            <div class="test-output pending" id="outputDesign">⏳ coerenza stili...</div>
        </div>
    </div>

    <!-- Pulsante test unificato -->
    <div style="display: flex; justify-content: center;">
        <button class="btn-test" id="btnEseguiTest">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            Esegui verifica CEO v3.5
        </button>
    </div>

    <!-- Footer stato globale -->
    <div class="footer-test">
        <div class="stato-globale">Stato orchestratore <span id="statoGlobale">⏳</span></div>
        <div style="font-size:0.9rem; color:#5f4a2f;">BrevettIAmo · test di conformità</div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // Riferimenti DOM
        var outputBoot = document.getElementById('outputBoot');
        var outputFirma = document.getElementById('outputFirma');
        var outputDesign = document.getElementById('outputDesign');
        var statoGlobale = document.getElementById('statoGlobale');
        var btnTest = document.getElementById('btnEseguiTest');

        // CEO Orchestrator v3.5 – nucleo simulato (verifica sintassi, nessun 'var object.property')
        window.ceoOrchestrator = {
            versione: '3.5',
            stato: 'inizializzato',
            boot: function() {
                // Simula boot
                var self = this;
                return new Promise(function(resolve) {
                    setTimeout(function() {
                        self.stato = 'operativo';
                        resolve('CEO Orchestrator v' + self.versione + ' avviato. Moduli: brevetti, prior art, rivendicazioni.');
                    }, 180);
                });
            },
            firmaBrevettuale: function() {
                return new Promise(function(resolve) {
                    setTimeout(function() {
                        resolve('Firma digitale brevettuale valida: BrevettIAmo_CEO_3.5_OK');
                    }, 140);
                });
            },
            verificaDesignSystem: function() {
                return new Promise(function(resolve) {
                    setTimeout(function() {
                        var stile = window.getComputedStyle(document.getElementById('pergamenaCEO'));
                        var bgOk = stile.backgroundColor && stile.backgroundColor.indexOf('rgb') > -1;
                        var bordoOk = stile.border && stile.border.includes('double');
                        var check = bgOk && bordoOk ? 'Design System coerente (pergamena, doppio bordo, oro)' : 'Design System: anomalia rilevata';
                        resolve(check);
                    }, 120);
                });
            }
        };

        // Funzione di test principale
        function eseguiTestCompleti() {
            // reset stati
            outputBoot.className = 'test-output pending';
            outputBoot.innerText = '⏳ esecuzione boot...';
            outputFirma.className = 'test-output pending';
            outputFirma.innerText = '⏳ verifica firma...';
            outputDesign.className = 'test-output pending';
            outputDesign.innerText = '⏳ controllo design...';
            statoGlobale.innerText = '⏳';
            btnTest.disabled = true;
            btnTest.style.opacity = '0.7';

            var orchestrator = window.ceoOrchestrator;

            // Esecuzione parallela con Promise allSettled per robustezza
            var pBoot = orchestrator.boot().then(function(msg) {
                outputBoot.innerText = '✅ ' + msg;
                outputBoot.className = 'test-output ok';
                return true;
            }).catch(function(err) {
                outputBoot.innerText = '❌ boot fallito: ' + (err.message || err);
                outputBoot.className = 'test-output fail';
                return false;
            });

            var pFirma = orchestrator.firmaBrevettuale().then(function(msg) {
                outputFirma.innerText = '✅ ' + msg;
                outputFirma.className = 'test-output ok';
                return true;
            }).catch(function(err) {
                outputFirma.innerText = '❌ firma errata: ' + (err.message || err);
                outputFirma.className = 'test-output fail';
                return false;
            });

            var pDesign = orchestrator.verificaDesignSystem().then(function(msg) {
                outputDesign.innerText = '✅ ' + msg;
                outputDesign.className = 'test-output ok';
                return true;
            }).catch(function(err) {
                outputDesign.innerText = '❌ design system: ' + (err.message || err);
                outputDesign.className = 'test-output fail';
                return false;
            });

            // Attesa completamento
            Promise.allSettled([pBoot, pFirma, pDesign]).then(function(results) {
                var successi = results.filter(function(r) { return r.status === 'fulfilled' && r.value === true; }).length;
                var fallimenti = results.filter(function(r) { return r.status === 'fulfilled' && r.value === false; }).length;
                // eventuali rejection già gestite nei catch, ma contiamo
                if (successi === 3) {
                    statoGlobale.innerText = '✅ TUTTI I TEST SUPERATI';
                    statoGlobale.style.background = '#4a7a4c';
                } else if (fallimenti > 0) {
                    statoGlobale.innerText = '⚠️ ' + fallimenti + ' test falliti';
                    statoGlobale.style.background = '#a13d3d';
                } else {
                    statoGlobale.innerText = '⚠️ test incompleti';
                    statoGlobale.style.background = '#b48c4c';
                }
                btnTest.disabled = false;
                btnTest.style.opacity = '1';
            });
        }

        // Event listener
        btnTest.addEventListener('click', eseguiTestCompleti);

        // Esecuzione automatica al caricamento (test iniziale)
        window.addEventListener('load', function() {
            // Piccolo ritardo per rendere naturale
            setTimeout(eseguiTestCompleti, 300);
        });

        // Verifica aggiuntiva: nessun 'var object.property' (solo per sicurezza)
        // (tutto il codice usa 'window.x' o variabili locali con var/let)
        console.log('BrevettIAmo CEO Orchestrator v3.5 · test caricato');
    })();
</script>

</body>
</html>
