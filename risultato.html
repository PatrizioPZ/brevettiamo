<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risultato - BrevettIAmo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Libre Baskerville', Georgia, serif;
    background: #f5f0e8;
    min-height: 100vh;
    color: #3d2b1f;
}

.pergamena {
    max-width: 900px;
    margin: 40px auto;
    background: #faf6f0;
    border: 2px solid #c9a96e;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(61,43,31,0.15), inset 0 0 60px rgba(201,169,110,0.1);
    padding: 50px;
    position: relative;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}
.logo h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    color: #8b0000;
    letter-spacing: 2px;
}

.titolo-risultato {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    color: #8b0000;
    margin-bottom: 20px;
    text-align: center;
    border-bottom: 2px solid #c9a96e;
    padding-bottom: 15px;
}

.sezione {
    margin: 25px 0;
    padding: 20px;
    background: rgba(201,169,110,0.08);
    border: 1px solid #d4c4a8;
    border-radius: 4px;
}

.sezione h2 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    font-size: 1.1rem;
    margin-bottom: 15px;
}

.sezione p, .sezione li {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #3d2b1f;
    margin-bottom: 8px;
}

.sezione ul {
    margin-left: 20px;
}

.contenuto-raw {
    background: #fff;
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    padding: 20px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 400px;
    overflow-y: auto;
}

.btn {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
    padding: 16px 40px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    background: #c9a96e;
    color: #fff;
    box-shadow: 0 4px 15px rgba(201,169,110,0.3);
    margin: 10px;
}

.btn:hover {
    background: #b8985a;
    transform: translateY(-2px);
}

.btn-secondary {
    background: #8b7355;
}

.btn-secondary:hover {
    background: #6b5a45;
}

.actions {
    text-align: center;
    margin-top: 30px;
}

.info-box {
    background: rgba(139,0,0,0.05);
    border: 1px dashed #8b0000;
    border-radius: 4px;
    padding: 15px;
    margin: 15px 0;
    font-size: 0.9rem;
}

.info-box strong {
    color: #8b0000;
}

@media (max-width: 600px) {
    .pergamena { padding: 25px; margin: 20px; }
}
</style>
<base target="_blank">
</head>
<body>

<div class="pergamena">
    <div class="logo">
        <h1>RISULTATO ELABORAZIONE</h1>
    </div>

    <div id="risultato-container">
        <div class="titolo-risultato" id="titolo-servizio">Caricamento risultato...</div>

        <div id="contenuto-reale">
            <!-- Qui verra inserito il contenuto reale -->
        </div>
    </div>

    <div class="actions">
        <button class="btn" onclick="scaricaRisultato()">SCARICA PDF</button>
        <button class="btn btn-secondary" onclick="tornaServizi()">TORNA AI SERVIZI</button>
    </div>
</div>

<script>
// ==========================================
// RISULTATO BREVETTIAMO - MOSTRA CONTENUTO REALE
// ==========================================

const servizioId = new URLSearchParams(window.location.search).get("servizio") || "servizio-deposito";
const risultatoJSON = localStorage.getItem("brevettiamo_risultato");
const servizioNome = localStorage.getItem("brevettiamo_servizio") || servizioId;

function mostraRisultato() {
    console.log("[Risultato] Caricamento risultato per servizio: " + servizioId);

    if (!risultatoJSON) {
        mostraErrore("Nessun risultato trovato. Riprova l elaborazione.");
        return;
    }

    try {
        const risultato = JSON.parse(risultatoJSON);
        console.log("[Risultato] Dati caricati:", risultato);

        // Titolo servizio
        const titoli = {
            "servizio-deposito": "Deposito Brevetto - Risultato",
            "servizio-prior-art": "Ricerca Prior Art - Risultato",
            "servizio-rivendicazioni": "Rivendicazioni - Risultato",
            "servizio-tavole": "Tavole Tecniche - Risultato",
            "servizio-cad": "Disegni CAD - Risultato"
        };

        document.getElementById("titolo-servizio").textContent = titoli[servizioId] || "Risultato Elaborazione";

        // Contenuto reale
        const container = document.getElementById("contenuto-reale");

        if (risultato.contenuto) {
            // Contenuto testuale dall IA
            container.innerHTML = '<div class="sezione"><h2>Analisi IA</h2><div class="contenuto-raw">' + escapeHtml(risultato.contenuto) + '</div></div>';
        } else if (risultato.documenti) {
            // Documenti generati
            let html = '';
            for (let i = 0; i < risultato.documenti.length; i++) {
                const doc = risultato.documenti[i];
                html += '<div class="sezione">';
                html += '<h2>' + escapeHtml(doc.nome) + '</h2>';
                html += '<div class="contenuto-raw">' + escapeHtml(doc.contenuto) + '</div>';
                html += '</div>';
            }
            container.innerHTML = html;
        } else if (risultato.rivendicazioni) {
            // Rivendicazioni
            let html = '<div class="sezione"><h2>Rivendicazioni Generate</h2><ul>';
            for (let i = 0; i < risultato.rivendicazioni.length; i++) {
                html += '<li>' + escapeHtml(risultato.rivendicazioni[i]) + '</li>';
            }
            html += '</ul></div>';
            container.innerHTML = html;
        } else if (risultato.tavole) {
            // Tavole
            let html = '<div class="sezione"><h2>Tavole Tecniche</h2>';
            for (let i = 0; i < risultato.tavole.length; i++) {
                const t = risultato.tavole[i];
                html += '<p><strong>Tavola ' + t.numero + ':</strong> ' + escapeHtml(t.descrizione) + ' (Tipo: ' + t.tipo + ')</p>';
            }
            html += '</div>';
            container.innerHTML = html;
        } else {
            // Fallback: mostra JSON completo
            container.innerHTML = '<div class="sezione"><h2>Dati Completi</h2><div class="contenuto-raw">' + escapeHtml(JSON.stringify(risultato, null, 2)) + '</div></div>';
        }

        // Info aggiuntive
        if (risultato.prezzo_stimato || risultato.tempo_stimato) {
            let info = '<div class="info-box">';
            if (risultato.prezzo_stimato) info += '<strong>Prezzo stimato:</strong> ' + risultato.prezzo_stimato + ' EUR<br>';
            if (risultato.tempo_stimato) info += '<strong>Tempo stimato:</strong> ' + risultato.tempo_stimato;
            info += '</div>';
            container.innerHTML += info;
        }

    } catch (error) {
        console.error("[Risultato] Errore parsing:", error);
        mostraErrore("Errore nel caricamento del risultato.");
    }
}

function mostraErrore(messaggio) {
    document.getElementById("contenuto-reale").innerHTML = 
        '<div class="info-box"><strong>Errore:</strong> ' + messaggio + '</div>';
}

function escapeHtml(text) {
    if (!text) return "";
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function scaricaRisultato() {
    const risultato = JSON.parse(risultatoJSON || "{}");
    const blob = new Blob([JSON.stringify(risultato, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "risultato-" + servizioId + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function tornaServizi() {
    window.location.href = "/brevettiamo/servizi.html";
}

// Carica risultato al avvio
document.addEventListener("DOMContentLoaded", mostraRisultato);
</script>

</body>
</html>
