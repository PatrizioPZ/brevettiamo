<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descrizione - BrevettIAmo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Georgia, serif; background: #f5f0e8; min-height: 100vh; color: #3d2b1f; }
.pergamena { max-width: 900px; margin: 40px auto; background: #faf6f0; border: 2px solid #c9a96e; border-radius: 4px; box-shadow: 0 4px 20px rgba(61,43,31,0.15); padding: 50px; }
.logo { text-align: center; margin-bottom: 30px; }
.logo h1 { font-family: Georgia, serif; font-size: 1.8rem; color: #8b0000; letter-spacing: 2px; }
.titolo-sezione { font-family: Georgia, serif; font-size: 1.3rem; color: #8b0000; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #c9a96e; padding-bottom: 15px; }
.sezione { margin: 25px 0; padding: 20px; background: rgba(201,169,110,0.08); border: 1px solid #d4c4a8; border-radius: 4px; }
.sezione h2 { font-family: Georgia, serif; color: #8b0000; font-size: 1.1rem; margin-bottom: 15px; }
.textarea-desc { width: 100%; min-height: 200px; padding: 15px; border: 1px solid #d4c4a8; border-radius: 4px; font-family: Georgia, serif; font-size: 0.95rem; line-height: 1.6; background: #fff; resize: vertical; margin-bottom: 15px; }
.textarea-desc:focus { outline: none; border-color: #8b0000; box-shadow: 0 0 5px rgba(139,0,0,0.1); }
.btn { font-family: Georgia, serif; font-size: 0.95rem; letter-spacing: 2px; padding: 16px 40px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.3s; background: #c9a96e; color: #fff; box-shadow: 0 4px 15px rgba(201,169,110,0.3); margin: 10px; }
.btn:hover { background: #b8985a; transform: translateY(-2px); }
.btn-secondary { background: #8b7355; }
.btn-secondary:hover { background: #6b5a45; }
.actions { text-align: center; margin-top: 30px; }
@media (max-width: 600px) { .pergamena { padding: 25px; margin: 20px; } }
</style>
<base target="_blank">
</head>
<body>
<div class="pergamena">
<div class="logo"><h1>DESCRIZIONE PROGETTO</h1></div>
<div class="titolo-sezione" id="titolo-servizio">Descrivi la tua invenzione</div>
<div class="sezione">
<h2>Descrizione Tecnica</h2>
<textarea class="textarea-desc" id="descrizione" placeholder="Descrivi la tua invenzione in dettaglio. Cosa fa? Come funziona? Qual e il problema che risolve? Esempio: Ho inventato un dispositivo che... Piu dettagli fornisci, migliore sara l analisi."></textarea>
</div>
<div class="actions">
<button class="btn" onclick="avviaElaborazione()">AVVIA ELABORAZIONE</button>
<button class="btn btn-secondary" onclick="tornaIndietro()">TORNA INDIETRO</button>
</div>
</div>
<script>
const servizioId = new URLSearchParams(window.location.search).get("servizio") || "servizio-deposito";
function caricaDescrizionePrecedente() {
    const descrizionePrecedente = localStorage.getItem("brevettiamo_descrizione");
    if (descrizionePrecedente) {
        document.getElementById("descrizione").value = descrizionePrecedente;
    }
}
function avviaElaborazione() {
    const descrizione = document.getElementById("descrizione").value.trim();
    if (!descrizione) {
        alert("Inserisci una descrizione prima di procedere.");
        return;
    }
    localStorage.setItem("brevettiamo_descrizione", descrizione);
    localStorage.setItem("brevettiamo_servizio", servizioId);
    window.location.href = "/brevettiamo/elaborazione.html?servizio=" + encodeURIComponent(servizioId);
}
function tornaIndietro() {
    window.history.back();
}
document.addEventListener("DOMContentLoaded", caricaDescrizionePrecedente);
</script>
</body>
</html>
