<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrevettIAmo - Elaborazione</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Courier+Prime&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Libre Baskerville', Georgia, serif;
    background: #f5f0e8;
    min-height: 100vh;
    color: #3d2b1f;
}

.pergamena {
    max-width: 900px;
    margin: 40px auto;
    background: #faf6f0;
    border: 2px solid #c9a96e;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(61,43,31,0.15), inset 0 0 60px rgba(201,169,110,0.1);
    padding: 50px;
    position: relative;
}

.header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid #d4c4a8;
}
.header h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.6rem;
    color: #8b0000;
    letter-spacing: 2px;
}
.header p {
    font-style: italic;
    color: #8b7355;
    font-size: 0.9rem;
    margin-top: 5px;
}

.servizio-info {
    text-align: center;
    margin-bottom: 25px;
    padding: 12px 20px;
    background: rgba(139,0,0,0.05);
    border: 1px dashed #8b0000;
    border-radius: 4px;
}
.servizio-info h3 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    font-size: 1rem;
}

/* Log in tempo reale */
.log-container {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 25px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    max-height: 300px;
    overflow-y: auto;
}
.log-container .log-title {
    color: #c9a96e;
    font-weight: bold;
    margin-bottom: 10px;
    border-bottom: 1px solid #333;
    padding-bottom: 8px;
}
.log-line {
    color: #a0a0a0;
    margin-bottom: 4px;
    padding-left: 8px;
    border-left: 2px solid #444;
}
.log-line.success { color: #4caf50; border-left-color: #4caf50; }
.log-line.error { color: #f44336; border-left-color: #f44336; }
.log-line.info { color: #64b5f6; border-left-color: #64b5f6; }
.log-line.api { color: #ff9800; border-left-color: #ff9800; }

/* Progress bar */
.progress-container {
    margin-bottom: 25px;
}
.progress-bar {
    width: 100%;
    height: 8px;
    background: #e0d5c5;
    border-radius: 4px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #c9a96e, #8b0000);
    border-radius: 4px;
    transition: width 0.5s ease;
    width: 0%;
}
.progress-label {
    text-align: center;
    margin-top: 8px;
    font-size: 0.85rem;
    color: #8b7355;
}

/* Stato elaborazione */
.stato-box {
    text-align: center;
    padding: 30px;
    background: rgba(201,169,110,0.08);
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    margin-bottom: 25px;
}
.stato-icon {
    font-size: 3rem;
    margin-bottom: 15px;
}
.stato-testo {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: #3d2b1f;
    margin-bottom: 8px;
}
.stato-sub {
    font-size: 0.85rem;
    color: #8b7355;
}

/* Errori */
.errore-box {
    background: rgba(139,0,0,0.08);
    border: 1px solid #8b0000;
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 25px;
    display: none;
}
.errore-box.active { display: block; }
.errore-box h4 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    margin-bottom: 10px;
}
.errore-box p {
    color: #5a3a3a;
    font-size: 0.9rem;
    line-height: 1.5;
}

/* Pulsanti */
.azioni {
    display: flex;
    gap: 15px;
    justify-content: center;
}
.btn {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
    padding: 16px 40px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    min-width: 200px;
}
.btn-primary {
    background: #8b0000;
    color: #fff;
    box-shadow: 0 4px 15px rgba(139,0,0,0.3);
}
.btn-primary:hover {
    background: #6b0000;
    transform: translateY(-2px);
}
.btn-primary:disabled {
    background: #a08080;
    cursor: not-allowed;
    transform: none;
}
.btn-secondary {
    background: transparent;
    color: #8b7355;
    border: 2px solid #d4c4a8;
}
.btn-secondary:hover {
    background: rgba(201,169,110,0.1);
    border-color: #c9a96e;
}

/* Risultato preview */
.risultato-preview {
    background: #fffef8;
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 25px;
    display: none;
}
.risultato-preview.active { display: block; }
.risultato-preview h4 {
    font-family: 'Cinzel', serif;
    color: #3d2b1f;
    margin-bottom: 12px;
}
.risultato-preview pre {
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    line-height: 1.4;
    color: #5a4a3a;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 200px;
    overflow-y: auto;
    background: #f5f0e8;
    padding: 12px;
    border-radius: 4px;
}

@media (max-width: 600px) {
    .pergamena { padding: 25px; margin: 20px; }
    .azioni { flex-direction: column; }
    .btn { width: 100%; }
}
</style>
<base target="_blank">
</head>
<body>

<div class="pergamena">
    <div class="header">
        <h1>ELABORAZIONE IN CORSO</h1>
        <p>La Dual IA sta analizzando la tua richiesta</p>
    </div>

    <div class="servizio-info" id="servizio-info">
        <h3 id="servizio-nome">Servizio</h3>
    </div>

    <!-- Stato -->
    <div class="stato-box" id="stato-box">
        <div class="stato-icon" id="stato-icon">&#9203;</div>
        <div class="stato-testo" id="stato-testo">Inizializzazione...</div>
        <div class="stato-sub" id="stato-sub">Preparazione della richiesta</div>
    </div>

    <!-- Progress bar -->
    <div class="progress-container" id="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">0%</div>
    </div>

    <!-- Log in tempo reale -->
    <div class="log-container" id="log-container">
        <div class="log-title">LOG DUAL IA</div>
        <div id="log-content"></div>
    </div>

    <!-- Preview risultato -->
    <div class="risultato-preview" id="risultato-preview">
        <h4>Anteprima Risultato</h4>
        <pre id="risultato-pre"></pre>
    </div>

    <!-- Errore -->
    <div class="errore-box" id="errore-box">
        <h4>Errore</h4>
        <p id="errore-msg"></p>
        <div class="azioni" style="margin-top:15px;">
            <button class="btn btn-secondary" onclick="riprova()">RIPROVA</button>
        </div>
    </div>

    <!-- Azioni -->
    <div class="azioni" id="azioni-finali" style="display:none;">
        <button class="btn btn-secondary" onclick="tornaDescrizione()">MODIFICA DESCRIZIONE</button>
        <button class="btn btn-primary" onclick="vaiRevisione()">VAI A REVISIONE</button>
    </div>
</div>

<script>
// ==================== CONFIGURAZIONE ====================
const SUPABASE_URL = 'https://jtekrvlmqnluvaiapmwb.supabase.co';
const EDGE_FUNCTION = 'https://jtekrvlmqnluvaiapmwb.supabase.co/functions/v1/call-ai-tavole-v5-slim';

const SERVIZI = {
    'servizio-deposito': 'Deposito Brevetto',
    'servizio-priorart': 'Ricerca Prior Art',
    'servizio-rivendicazioni': 'Rivendicazioni',
    'servizio-monitoraggio': 'Monitoraggio',
    'servizio-priorart-base': 'Ricerca Prior Art Base',
    'servizio-priorart-avanzata': 'Ricerca Prior Art Avanzata',
    'servizio-analisi-brevettabilita': 'Analisi Brevettabilita',
    'servizio-claims-base': 'Redazione Claims Base',
    'servizio-claims-pro': 'Redazione Claims Pro',
    'servizio-traduzione-claims': 'Traduzione Claims',
    'servizio-monitoraggio-concorrenza': 'Monitoraggio Concorrenza',
    'servizio-consulenza': 'Consulenza 1:1',
    'servizio-analisi-tecnica': 'Analisi Tecnica',
    'servizio-ricerca-figurativa': 'Ricerca Figurativa',
    'servizio-analisi-nullita': 'Analisi Nullita',
    'servizio-opposizione': 'Preparazione Opposizione',
    'servizio-licensing': 'Strategia Licensing',
    'servizio-valorizzazione': 'Valorizzazione Brevetto',
    'servizio-due-diligence': 'Due Diligence IP',
    'servizio-freedom-to-operate': 'Freedom to Operate',
    'servizio-patentability': 'Patentability Search',
    'servizio-landscape': 'Landscape Analysis',
    'servizio-legale-base': 'Supporto Legale Base'
};

// ==================== STATO ====================
let servizioCorrente = null;
let datiSessione = null;
let risultatoElaborazione = null;
let progresso = 0;
let logInterval = null;

// ==================== INIZIALIZZAZIONE ====================
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    servizioCorrente = params.get('servizio');

    // Recupera dati da sessionStorage
    const datiRaw = sessionStorage.getItem('brevettiamo_dati');
    if (datiRaw) {
        try {
            datiSessione = JSON.parse(datiRaw);
        } catch (e) {
            mostraErrore('Dati sessione corrotti. Torna alla descrizione.');
            return;
        }
    }

    if (!servizioCorrente || !datiSessione) {
        mostraErrore('Dati mancanti. Torna alla descrizione e riprova.');
        return;
    }

    const nomeServizio = SERVIZI[servizioCorrente] || servizioCorrente;
    document.getElementById('servizio-nome').textContent = nomeServizio;

    // Avvia elaborazione
    avviaElaborazione();
});

// ==================== LOG ====================
function aggiungiLog(msg, tipo) {
    const container = document.getElementById('log-content');
    const line = document.createElement('div');
    line.className = 'log-line ' + (tipo || '');
    line.textContent = '[' + new Date().toLocaleTimeString('it-IT') + '] ' + msg;
    container.appendChild(line);

    const logContainer = document.getElementById('log-container');
    logContainer.scrollTop = logContainer.scrollHeight;
}

function aggiornaProgresso(valore, testo) {
    progresso = valore;
    document.getElementById('progress-fill').style.width = valore + '%';
    document.getElementById('progress-label').textContent = valore + '%';
    if (testo) {
        document.getElementById('stato-testo').textContent = testo;
    }
}

function aggiornaStato(icona, testo, sub) {
    document.getElementById('stato-icon').textContent = icona;
    document.getElementById('stato-testo').textContent = testo;
    if (sub) document.getElementById('stato-sub').textContent = sub;
}

// ==================== ELABORAZIONE ====================
async function avviaElaborazione() {
    aggiungiLog('Inizializzazione elaborazione...', 'info');
    aggiungiLog('Servizio: ' + servizioCorrente, 'info');
    aggiungiLog('Descrizione: ' + (datiSessione.descrizione ? datiSessione.descrizione.substring(0, 50) + '...' : 'Nessuna descrizione'), 'info');
    aggiungiLog('File allegati: ' + (datiSessione.files ? datiSessione.files.length : 0), 'info');
    aggiungiLog('Link web: ' + (datiSessione.links ? datiSessione.links.length : 0), 'info');

    aggiornaProgresso(10, 'Preparazione dati...');
    aggiornaStato('&#9203;', 'Preparazione dati', 'Compressione e codifica in corso');

    // Simula progresso durante l'attesa
    logInterval = setInterval(function() {
        if (progresso < 80) {
            aggiornaProgresso(progresso + 5);
        }
    }, 2000);

    try {
        // Prepara payload
        const payload = {
            servizio: servizioCorrente,
            descrizione: datiSessione.descrizione || '',
            fase: 'completo',
            datiExtra: {
                files: datiSessione.files || [],
                links: datiSessione.links || []
            }
        };

        aggiungiLog('Invio richiesta a Edge Function...', 'info');
        aggiornaStato('&#128640;', 'Connessione Dual IA', 'Chiamata API in corso');

        const response = await fetch(EDGE_FUNCTION, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            'Authorization': 'Bearer sb_publishable_p9WH85YPfwtaKp4tfcDwug_Q9duausk'
            },
            body: JSON.stringify(payload)
        });

        clearInterval(logInterval);

        if (!response.ok) {
            const errorText = await response.text();
            throw new Error('HTTP ' + response.status + ': ' + errorText);
        }

        const result = await response.json();

        aggiungiLog('Risposta ricevuta!', 'success');
        aggiungiLog('API Analitica: ' + (result.metadata?.apiAnalitica || 'N/A'), 'api');
        aggiungiLog('API Critica: ' + (result.metadata?.apiCritica || 'N/A'), 'api');
        aggiungiLog('Catena API: ' + (result.metadata?.catena || 'N/A'), 'api');

        if (result.success) {
            risultatoElaborazione = result;
            aggiornaProgresso(100, 'Completato!');
            aggiornaStato('&#9989;', 'Elaborazione completata', 'Dual IA ha terminato la analisi');

            // Mostra anteprima
            document.getElementById('risultato-pre').textContent = JSON.stringify(result, null, 2);
            document.getElementById('risultato-preview').classList.add('active');

            // Salva risultato
            sessionStorage.setItem('brevettiamo_risultato', JSON.stringify(result));
            sessionStorage.setItem('brevettiamo_servizio', servizioCorrente);

            // Mostra pulsanti finali
            document.getElementById('azioni-finali').style.display = 'flex';

            aggiungiLog('Risultato salvato in sessione.', 'success');
            aggiungiLog('Pronto per revisione.', 'success');
        } else {
            throw new Error(result.error || 'Errore sconosciuto dalla Dual IA');
        }

    } catch (error) {
        clearInterval(logInterval);
        aggiungiLog('ERRORE: ' + error.message, 'error');
        mostraErrore('Errore durante la elaborazione: ' + error.message + '\n\nVerifica che:\n1. La Edge Function sia deployata su Supabase\n2. Le API key siano configurate nei secrets\n3. La connessione internet sia attiva');
        aggiornaStato('&#10060;', 'Errore', 'Elaborazione fallita');
        aggiornaProgresso(0);
    }
}

// ==================== ERRORI ====================
function mostraErrore(msg) {
    document.getElementById('errore-msg').textContent = msg;
    document.getElementById('errore-box').classList.add('active');
    document.getElementById('stato-box').style.display = 'none';
    document.getElementById('progress-container').style.display = 'none';
    document.getElementById('log-container').style.display = 'none';
}

// ==================== AZIONI ====================
function riprova() {
    document.getElementById('errore-box').classList.remove('active');
    document.getElementById('stato-box').style.display = 'block';
    document.getElementById('progress-container').style.display = 'block';
    document.getElementById('log-container').style.display = 'block';
    document.getElementById('log-content').innerHTML = '';
    document.getElementById('risultato-preview').classList.remove('active');
    document.getElementById('azioni-finali').style.display = 'none';
    avviaElaborazione();
}

function tornaDescrizione() {
    window.location.href = 'descrizione.html?servizio=' + encodeURIComponent(servizioCorrente);
}

function vaiRevisione() {
    window.location.href = 'revisione.html?servizio=' + encodeURIComponent(servizioCorrente);
}
</script>

</body>
</html>
