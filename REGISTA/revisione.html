<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrevettIAmo - Revisione Risultato</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Courier+Prime&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Libre Baskerville', Georgia, serif;
    background: #f5f0e8;
    min-height: 100vh;
    color: #3d2b1f;
}

.pergamena {
    max-width: 900px;
    margin: 40px auto;
    background: #faf6f0;
    border: 2px solid #c9a96e;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(61,43,31,0.15), inset 0 0 60px rgba(201,169,110,0.1);
    padding: 50px;
    position: relative;
}

.header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid #d4c4a8;
}
.header h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.6rem;
    color: #8b0000;
    letter-spacing: 2px;
}
.header p {
    font-style: italic;
    color: #8b7355;
    font-size: 0.9rem;
    margin-top: 5px;
}

.servizio-info {
    text-align: center;
    margin-bottom: 25px;
    padding: 12px 20px;
    background: rgba(139,0,0,0.05);
    border: 1px dashed #8b0000;
    border-radius: 4px;
}
.servizio-info h3 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    font-size: 1rem;
}

/* Info API usate */
.api-info {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}
.api-badge {
    background: rgba(201,169,110,0.15);
    border: 1px solid #c9a96e;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.8rem;
    color: #5a4a3a;
}
.api-badge strong {
    color: #8b0000;
}

/* Sezioni risultato */
.sezione-risultato {
    background: #fffef8;
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
}
.sezione-header {
    background: rgba(201,169,110,0.15);
    padding: 12px 20px;
    border-bottom: 1px solid #d4c4a8;
    display: flex;
    align-items: center;
    gap: 10px;
}
.sezione-header h4 {
    font-family: 'Cinzel', serif;
    color: #3d2b1f;
    font-size: 1rem;
}
.sezione-header .icon {
    font-size: 1.2rem;
}
.sezione-body {
    padding: 20px;
}

/* Campi dati */
.campo {
    margin-bottom: 15px;
}
.campo:last-child {
    margin-bottom: 0;
}
.campo-label {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: #8b7355;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.campo-valore {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #3d2b1f;
    padding: 10px 15px;
    background: rgba(201,169,110,0.05);
    border-radius: 4px;
    border-left: 3px solid #c9a96e;
}
.campo-valore.lista {
    padding: 0;
    background: none;
    border: none;
}
.campo-valore.lista ul {
    list-style: none;
    padding: 0;
}
.campo-valore.lista li {
    padding: 8px 15px;
    background: rgba(201,169,110,0.05);
    border-radius: 4px;
    margin-bottom: 6px;
    border-left: 3px solid #c9a96e;
    font-size: 0.9rem;
}
.campo-valore.lista li:last-child {
    margin-bottom: 0;
}

/* Risultati EPO */
.epo-results {
    margin-top: 15px;
}
.epo-item {
    padding: 12px 15px;
    background: rgba(26,82,118,0.05);
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    margin-bottom: 8px;
}
.epo-item .epo-db {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    color: #1a5276;
    margin-bottom: 4px;
}
.epo-item .epo-title {
    font-size: 0.9rem;
    color: #3d2b1f;
    margin-bottom: 4px;
}
.epo-item .epo-id {
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    color: #8b7355;
}

/* Verifica box */
.verifica-box {
    background: rgba(44,95,45,0.05);
    border: 1px solid #2c5f2d;
    border-radius: 4px;
    padding: 15px;
    margin-bottom: 20px;
}
.verifica-box.approvato {
    background: rgba(76,175,80,0.08);
    border-color: #4caf50;
}
.verifica-box.rifiutato {
    background: rgba(244,67,54,0.08);
    border-color: #f44336;
}
.verifica-box h4 {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.verifica-box.approvato h4 { color: #2c5f2d; }
.verifica-box.rifiutato h4 { color: #8b0000; }
.verifica-box p {
    font-size: 0.9rem;
    line-height: 1.5;
    color: #5a4a3a;
}

/* JSON raw (fallback) */
.json-raw {
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    line-height: 1.5;
    color: #5a4a3a;
    background: #f5f0e8;
    padding: 15px;
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* Metadata */
.metadata-box {
    background: rgba(201,169,110,0.08);
    border: 1px dashed #c9a96e;
    border-radius: 4px;
    padding: 15px;
    margin-bottom: 20px;
    font-size: 0.8rem;
    color: #8b7355;
}
.metadata-box strong {
    color: #3d2b1f;
}

/* Pulsanti */
.azioni {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 30px;
    flex-wrap: wrap;
}
.btn {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    letter-spacing: 2px;
    padding: 14px 30px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    min-width: 180px;
}
.btn-success {
    background: #2c5f2d;
    color: #fff;
    box-shadow: 0 4px 15px rgba(44,95,45,0.3);
}
.btn-success:hover {
    background: #1e4a1f;
    transform: translateY(-2px);
}
.btn-secondary {
    background: transparent;
    color: #8b7355;
    border: 2px solid #d4c4a8;
}
.btn-secondary:hover {
    background: rgba(201,169,110,0.1);
    border-color: #c9a96e;
}
.btn-download {
    background: #1a5276;
    color: #fff;
    box-shadow: 0 4px 15px rgba(26,82,118,0.3);
}
.btn-download:hover {
    background: #134060;
    transform: translateY(-2px);
}

/* Errore */
.errore-box {
    background: rgba(139,0,0,0.08);
    border: 1px solid #8b0000;
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 25px;
    display: none;
}
.errore-box.active { display: block; }
.errore-box h4 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    margin-bottom: 10px;
}

/* Loading */
.loading-box {
    text-align: center;
    padding: 40px;
}
.loading-icon {
    font-size: 3rem;
    margin-bottom: 15px;
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

@media (max-width: 600px) {
    .pergamena { padding: 25px; margin: 20px; }
    .azioni { flex-direction: column; }
    .btn { width: 100%; }
    .api-info { flex-direction: column; align-items: center; }
}
</style>
<base target="_blank">
</head>
<body>

<div class="pergamena">
    <div class="header">
        <h1>REVISIONE E CORREZIONE</h1>
        <p>Verifica il risultato della Dual IA</p>
    </div>

    <div class="servizio-info" id="servizio-info">
        <h3 id="servizio-nome">Servizio</h3>
    </div>

    <!-- Loading -->
    <div class="loading-box" id="loading-box">
        <div class="loading-icon">&#9203;</div>
        <p style="color:#8b7355;font-style:italic;">Caricamento risultato...</p>
    </div>

    <!-- Errore -->
    <div class="errore-box" id="errore-box">
        <h4>Errore</h4>
        <p id="errore-msg"></p>
    </div>

    <!-- Contenuto risultato -->
    <div id="contenuto-risultato" style="display:none;">

        <!-- Info API -->
        <div class="api-info" id="api-info"></div>

        <!-- Metadata -->
        <div class="metadata-box" id="metadata-box"></div>

        <!-- Verifica Dual IA -->
        <div class="verifica-box" id="verifica-box">
            <h4 id="verifica-titolo">Verifica Dual IA</h4>
            <p id="verifica-testo"></p>
        </div>

        <!-- Risultato formattato -->
        <div id="risultato-formattato"></div>

        <!-- Risultati EPO (se presenti) -->
        <div class="sezione-risultato" id="epo-section" style="display:none;">
            <div class="sezione-header">
                <span class="icon">&#127760;</span>
                <h4>Risultati Ricerca EPO</h4>
            </div>
            <div class="sezione-body" id="epo-body"></div>
        </div>

        <!-- JSON Raw (toggle) -->
        <div class="sezione-risultato">
            <div class="sezione-header" style="cursor:pointer;" onclick="toggleRaw()">
                <span class="icon" id="raw-icon">&#9654;</span>
                <h4>Dati Completi (JSON)</h4>
            </div>
            <div class="sezione-body" id="raw-body" style="display:none;">
                <pre class="json-raw" id="json-raw"></pre>
            </div>
        </div>

        <!-- Azioni -->
        <div class="azioni" id="azioni">
            <button class="btn btn-secondary" onclick="tornaDescrizione()">MODIFICA DESCRIZIONE</button>
            <button class="btn btn-download" onclick="scaricaJSON()">SCARICA JSON</button>
            <button class="btn btn-success" onclick="accettaRisultato()">ACCETTA RISULTATO</button>
        </div>
    </div>
</div>

<script>
// ==================== CONFIGURAZIONE ====================
const SERVIZI = {
    'servizio-deposito': 'Deposito Brevetto',
    'servizio-priorart': 'Ricerca Prior Art',
    'servizio-rivendicazioni': 'Rivendicazioni',
    'servizio-monitoraggio': 'Monitoraggio',
    'servizio-priorart-base': 'Ricerca Prior Art Base',
    'servizio-priorart-avanzata': 'Ricerca Prior Art Avanzata',
    'servizio-analisi-brevettabilita': 'Analisi Brevettabilita',
    'servizio-claims-base': 'Redazione Claims Base',
    'servizio-claims-pro': 'Redazione Claims Pro',
    'servizio-traduzione-claims': 'Traduzione Claims',
    'servizio-monitoraggio-concorrenza': 'Monitoraggio Concorrenza',
    'servizio-consulenza': 'Consulenza 1:1',
    'servizio-analisi-tecnica': 'Analisi Tecnica',
    'servizio-ricerca-figurativa': 'Ricerca Figurativa',
    'servizio-analisi-nullita': 'Analisi Nullita',
    'servizio-opposizione': 'Preparazione Opposizione',
    'servizio-licensing': 'Strategia Licensing',
    'servizio-valorizzazione': 'Valorizzazione Brevetto',
    'servizio-due-diligence': 'Due Diligence IP',
    'servizio-freedom-to-operate': 'Freedom to Operate',
    'servizio-patentability': 'Patentability Search',
    'servizio-landscape': 'Landscape Analysis',
    'servizio-legale-base': 'Supporto Legale Base'
};

// ==================== STATO ====================
let servizioCorrente = null;
let risultato = null;
let datiSessione = null;

// ==================== INIZIALIZZAZIONE ====================
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    servizioCorrente = params.get('servizio');

    const nomeServizio = SERVIZI[servizioCorrente] || servizioCorrente || 'Servizio';
    document.getElementById('servizio-nome').textContent = nomeServizio;

    // Recupera risultato da sessionStorage
    const risultatoRaw = sessionStorage.getItem('brevettiamo_risultato');
    const datiRaw = sessionStorage.getItem('brevettiamo_dati');

    if (datiRaw) {
        try { datiSessione = JSON.parse(datiRaw); } catch(e) {}
    }

    if (!risultatoRaw) {
        mostraErrore('Nessun risultato trovato. Torna alla descrizione e avvia l'elaborazione.');
        document.getElementById('loading-box').style.display = 'none';
        return;
    }

    try {
        risultato = JSON.parse(risultatoRaw);
        document.getElementById('loading-box').style.display = 'none';
        document.getElementById('contenuto-risultato').style.display = 'block';
        renderizzaRisultato();
    } catch (e) {
        mostraErrore('Errore nel parsing del risultato: ' + e.message);
        document.getElementById('loading-box').style.display = 'none';
    }
});

// ==================== RENDERIZZAZIONE ====================
function renderizzaRisultato() {
    if (!risultato) return;

    // API info
    const apiInfo = document.getElementById('api-info');
    const apiAnalitica = risultato.metadata?.apiAnalitica || 'N/A';
    const apiCritica = risultato.metadata?.apiCritica || 'N/A';
    apiInfo.innerHTML = 
        '<span class="api-badge"><strong>IA Analitica:</strong> ' + apiAnalitica + '</span>' +
        '<span class="api-badge"><strong>IA Critica:</strong> ' + apiCritica + '</span>' +
        '<span class="api-badge"><strong>Timestamp:</strong> ' + formattaData(risultato.timestamp) + '</span>';

    // Metadata
    const metadata = document.getElementById('metadata-box');
    const catena = risultato.metadata?.catena || 'N/A';
    const compressione = risultato.metadata?.compressione;
    let metaText = 'Catena API: ' + catena;
    if (compressione) {
        metaText += ' | Compressione: ' + (compressione.ingresso ? 'SI' : 'NO') + 
                    ' | Orig: ' + (compressione.dimensioneOriginale || 'N/A') + 
                    ' | Comp: ' + (compressione.dimensioneCompressa || 'N/A');
    }
    metadata.textContent = metaText;

    // Verifica
    const verificaBox = document.getElementById('verifica-box');
    const verificaTesto = document.getElementById('verifica-testo');
    const verificaTitolo = document.getElementById('verifica-titolo');

    const approvato = risultato.risultato?.approvato;
    const note = risultato.risultato?.note || 'Nessuna nota';

    if (approvato === true) {
        verificaBox.className = 'verifica-box approvato';
        verificaTitolo.innerHTML = '&#9989; Verifica Dual IA: APPROVATO';
    } else if (approvato === false) {
        verificaBox.className = 'verifica-box rifiutato';
        verificaTitolo.innerHTML = '&#10060; Verifica Dual IA: RICHIESTE MODIFICHE';
    } else {
        verificaBox.className = 'verifica-box';
        verificaTitolo.innerHTML = '&#9888; Verifica Dual IA: IN REVISIONE';
    }
    verificaTesto.textContent = note;

    // Renderizza in base al tipo di servizio
    const container = document.getElementById('risultato-formattato');
    container.innerHTML = '';

    const parsed = risultato.analisi?.parsed;

    if (parsed) {
        // PRIOR ART
        if (servizioCorrente.includes('priorart') || servizioCorrente.includes('patentability') || servizioCorrente.includes('landscape')) {
            renderizzaPriorArt(container, parsed);
        }
        // RIVENDICAZIONI / CLAIMS
        else if (servizioCorrente.includes('rivendicazioni') || servizioCorrente.includes('claims')) {
            renderizzaRivendicazioni(container, parsed);
        }
        // ANALISI BREVETTABILITA / FTO / NULLITA
        else if (servizioCorrente.includes('brevettabilita') || servizioCorrente.includes('freedom') || servizioCorrente.includes('nullita')) {
            renderizzaAnalisi(container, parsed);
        }
        // DEPOSITO / REDAZIONE
        else if (servizioCorrente.includes('deposito') || servizioCorrente.includes('opposizione')) {
            renderizzaDeposito(container, parsed);
        }
        // GENERICO
        else {
            renderizzaGenerico(container, parsed);
        }
    } else {
        // Nessun parsed, mostra raw
        renderizzaGenerico(container, risultato.analisi?.raw || risultato);
    }

    // Risultati EPO
    if (risultato.risorseEPO && risultato.risorseEPO.length > 0) {
        renderizzaEPO(risultato.risorseEPO);
    }

    // JSON raw
    document.getElementById('json-raw').textContent = JSON.stringify(risultato, null, 2);
}

// ==================== RENDERIZZATORI PER TIPO ====================

function renderizzaPriorArt(container, data) {
    // Campo tecnico
    if (data.campoTecnico) {
        container.appendChild(creaCampo('Campo Tecnico', data.campoTecnico));
    }

    // Parole chiave
    if (data.paroleChiave && data.paroleChiave.length > 0) {
        container.appendChild(creaCampoLista('Parole Chiave', data.paroleChiave));
    }

    // Classificazioni IPC
    if (data.classificazioniIPC && data.classificazioniIPC.length > 0) {
        container.appendChild(creaCampoLista('Classificazioni IPC', data.classificazioniIPC));
    }

    // Query ricerca
    if (data.queryRicerca) {
        container.appendChild(creaCampo('Query di Ricerca', data.queryRicerca));
    }

    // Potenziali prior art
    if (data.potenzialiPriorArt && data.potenzialiPriorArt.length > 0) {
        container.appendChild(creaCampoLista('Potenziali Prior Art', data.potenzialiPriorArt));
    }

    // Se vuoto, mostra generico
    if (container.innerHTML === '') {
        renderizzaGenerico(container, data);
    }
}

function renderizzaRivendicazioni(container, data) {
    // Rivendicazione indipendente
    if (data.rivendicazioneIndipendente) {
        container.appendChild(creaCampo('Rivendicazione Indipendente', data.rivendicazioneIndipendente));
    }

    // Rivendicazioni dipendenti
    if (data.rivendicazioniDipendenti && data.rivendicazioniDipendenti.length > 0) {
        container.appendChild(creaCampoLista('Rivendicazioni Dipendenti', data.rivendicazioniDipendenti));
    }

    // Caratteristiche essenziali
    if (data.caratteristicheEssenziali && data.caratteristicheEssenziali.length > 0) {
        container.appendChild(creaCampoLista('Caratteristiche Essenziali', data.caratteristicheEssenziali));
    }

    if (container.innerHTML === '') {
        renderizzaGenerico(container, data);
    }
}

function renderizzaAnalisi(container, data) {
    // Risultato analisi
    if (data.analisi || data.valutazione) {
        container.appendChild(creaCampo('Analisi', data.analisi || data.valutazione));
    }

    // Criteri
    if (data.criteri && data.criteri.length > 0) {
        container.appendChild(creaCampoLista('Criteri Valutati', data.criteri));
    }

    // Conclusione
    if (data.conclusione || data.esito) {
        container.appendChild(creaCampo('Conclusione', data.conclusione || data.esito));
    }

    // Raccomandazioni
    if (data.raccomandazioni && data.raccomandazioni.length > 0) {
        container.appendChild(creaCampoLista('Raccomandazioni', data.raccomandazioni));
    }

    if (container.innerHTML === '') {
        renderizzaGenerico(container, data);
    }
}

function renderizzaDeposito(container, data) {
    // Descrizione tecnica
    if (data.descrizioneTecnica || data.descrizione) {
        container.appendChild(creaCampo('Descrizione Tecnica', data.descrizioneTecnica || data.descrizione));
    }

    // Rivendicazioni
    if (data.rivendicazioni) {
        container.appendChild(creaCampo('Rivendicazioni', data.rivendicazioni));
    }

    // Abstract
    if (data.abstract || data.riassunto) {
        container.appendChild(creaCampo('Abstract', data.abstract || data.riassunto));
    }

    // Figure
    if (data.figure && data.figure.length > 0) {
        container.appendChild(creaCampoLista('Figure Richieste', data.figure.map(function(f) {
            return (typeof f === 'string') ? f : (f.tipo + ': ' + f.descrizione);
        })));
    }

    if (container.innerHTML === '') {
        renderizzaGenerico(container, data);
    }
}

function renderizzaGenerico(container, data) {
    // Mostra tutti i campi come lista generica
    if (typeof data === 'object' && data !== null) {
        Object.keys(data).forEach(function(key) {
            const val = data[key];
            if (Array.isArray(val)) {
                container.appendChild(creaCampoLista(key, val));
            } else if (typeof val === 'string' || typeof val === 'number') {
                container.appendChild(creaCampo(key, String(val)));
            }
        });
    } else {
        container.appendChild(creaCampo('Risultato', String(data)));
    }
}

// ==================== HELPERS ====================
function creaCampo(label, valore) {
    const div = document.createElement('div');
    div.className = 'campo';
    div.innerHTML = 
        '<div class="campo-label">' + label + '</div>' +
        '<div class="campo-valore">' + escapeHtml(valore) + '</div>';
    return div;
}

function creaCampoLista(label, items) {
    const div = document.createElement('div');
    div.className = 'campo';
    let html = '<div class="campo-label">' + label + '</div>';
    html += '<div class="campo-valore lista"><ul>';
    items.forEach(function(item) {
        html += '<li>' + escapeHtml(String(item)) + '</li>';
    });
    html += '</ul></div>';
    div.innerHTML = html;
    return div;
}

function renderizzaEPO(risorse) {
    const section = document.getElementById('epo-section');
    const body = document.getElementById('epo-body');

    body.innerHTML = '';
    risorse.forEach(function(item) {
        const div = document.createElement('div');
        div.className = 'epo-item';
        div.innerHTML = 
            '<div class="epo-db">' + escapeHtml(item.db || 'EPO') + '</div>' +
            '<div class="epo-title">' + escapeHtml(item.title || 'N/A') + '</div>' +
            '<div class="epo-id">' + escapeHtml(item.id || 'N/A') + '</div>';
        body.appendChild(div);
    });

    section.style.display = 'block';
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formattaData(isoString) {
    if (!isoString) return 'N/A';
    try {
        const d = new Date(isoString);
        return d.toLocaleString('it-IT');
    } catch(e) {
        return isoString;
    }
}

// ==================== TOGGLE RAW ====================
function toggleRaw() {
    const body = document.getElementById('raw-body');
    const icon = document.getElementById('raw-icon');
    if (body.style.display === 'none') {
        body.style.display = 'block';
        icon.innerHTML = '&#9660;';
    } else {
        body.style.display = 'none';
        icon.innerHTML = '&#9654;';
    }
}

// ==================== ERRORI ====================
function mostraErrore(msg) {
    document.getElementById('errore-msg').textContent = msg;
    document.getElementById('errore-box').classList.add('active');
}

// ==================== AZIONI ====================
function tornaDescrizione() {
    window.location.href = 'descrizione.html?servizio=' + encodeURIComponent(servizioCorrente);
}

function scaricaJSON() {
    if (!risultato) return;

    const dataStr = JSON.stringify(risultato, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'brevettiamo_' + servizioCorrente + '_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function accettaRisultato() {
    // Salva come "accettato" in sessionStorage
    if (risultato) {
        risultato.accettato = true;
        risultato.dataAccettazione = new Date().toISOString();
        sessionStorage.setItem('brevettiamo_risultato', JSON.stringify(risultato));
    }

    alert('Risultato accettato! Puoi scaricare il file JSON o proseguire con altri servizi.');

    // Torna al menu servizi
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'brevettiamo', action: 'torna-menu' }, '*');
    } else {
        window.location.href = '../REGISTA/index.html';
    }
}
</script>
