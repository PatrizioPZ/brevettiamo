<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrevettIAmo - Regista Servizi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Libre Baskerville', Georgia, serif;
    background: #f5f0e8;
    min-height: 100vh;
    color: #3d2b1f;
}

.pergamena {
    max-width: 900px;
    margin: 40px auto;
    background: #faf6f0;
    border: 2px solid #c9a96e;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(61,43,31,0.15), inset 0 0 60px rgba(201,169,110,0.1);
    padding: 50px;
    position: relative;
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}
.logo h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    color: #8b0000;
    letter-spacing: 2px;
}
.logo p {
    font-style: italic;
    color: #8b7355;
    font-size: 0.9rem;
    margin-top: 5px;
}

.login-box {
    max-width: 400px;
    margin: 0 auto;
    padding: 30px;
    background: rgba(201,169,110,0.08);
    border: 1px solid #d4c4a8;
    border-radius: 4px;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    background: #fffef8;
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 14px;
}

.btn {
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
    padding: 16px 40px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    background: #c9a96e;
    color: #fff;
    box-shadow: 0 4px 15px rgba(201,169,110,0.3);
    width: 100%;
}

.btn:hover {
    background: #b8985a;
    transform: translateY(-2px);
}

.servizio-info {
    text-align: center;
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(139,0,0,0.05);
    border: 1px dashed #8b0000;
    border-radius: 4px;
}
.servizio-info h3 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    font-size: 1.1rem;
}
.servizio-info p {
    color: #5a4a3a;
    font-size: 0.9rem;
    margin-top: 5px;
}

.servizi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.servizio-card {
    background: rgba(201,169,110,0.08);
    border: 1px solid #d4c4a8;
    border-radius: 4px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
}
.servizio-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(61,43,31,0.12);
    border-color: #c9a96e;
}
.servizio-card h4 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    font-size: 1rem;
    margin-bottom: 8px;
}
.servizio-card p {
    font-size: 0.85rem;
    color: #8b7355;
}

#flusso-iframe {
    width: 100%;
    height: 95vh;
    border: 2px solid #c9a96e;
    border-radius: 4px;
    display: none;
    background: #faf6f0;
}

.user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: #3d2b1f;
    color: #f5f0e8;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
}
.user-bar a {
    color: #c9a96e;
    text-decoration: none;
    cursor: pointer;
}
.user-bar a:hover {
    text-decoration: underline;
}

.hidden { display: none !important; }

.stato-login {
    text-align: center;
    padding: 20px;
    color: #8b7355;
    font-style: italic;
}

@media (max-width: 600px) {
    .pergamena { padding: 25px; margin: 20px; }
    .servizi-grid { grid-template-columns: 1fr; }
}
</style>
<base target="_blank">
</head>
<body>

<div id="user-bar" class="user-bar hidden">
    <span id="user-email">Utente</span>
    <div>
        <a onclick="tornaMenu()">Menu Servizi</a> | 
        <a onclick="logout()">Esci</a>
    </div>
</div>

<div class="pergamena" id="login-panel">
    <div class="logo">
        <h1>BREVETTIAMO</h1>
        <p>Regista Servizi</p>
    </div>
    
    <div class="servizio-info" id="servizio-info">
        <h3>Servizio selezionato</h3>
        <p id="nome-servizio">Caricamento...</p>
    </div>

    <div class="login-box" id="login-box">
        <input type="email" id="email" placeholder="Email" autocomplete="email">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button class="btn" onclick="login()">ENTRA NEL SERVIZIO</button>
        <div class="stato-login" id="login-msg"></div>
    </div>
</div>

<div class="pergamena hidden" id="menu-panel">
    <div class="logo">
        <h1>BREVETTIAMO</h1>
        <p>Seleziona un servizio</p>
    </div>
    
    <div class="servizi-grid" id="servizi-grid">
    </div>
</div>

<iframe id="flusso-iframe" name="flusso-frame"></iframe>

<script>
const SERVIZI = {
    'servizio-deposito': {
        nome: 'Deposito Brevetto',
        descrizione: 'Preparazione e deposito completo presso l\'UIBM. Documentazione tecnica, rivendicazioni e tavole incluse.',
        icona: 'D',
        colore: '#8b0000'
    },
    'servizio-priorart': {
        nome: 'Ricerca Prior Art',
        descrizione: 'Ricerca completa in database mondiali per verificare la novita della tua invenzione prima del deposito.',
        icona: 'R',
        colore: '#1a5276'
    },
    'servizio-rivendicazioni': {
        nome: 'Rivendicazioni',
        descrizione: 'Redazione professionale delle rivendicazioni brevettuali. La parte piu importante del tuo brevetto.',
        icona: 'V',
        colore: '#6c3483'
    },
    'servizio-tavole': {
        nome: 'Tavole Tecniche',
        descrizione: 'Generazione tavole tecniche in formato SVG. Pronti per UIBM, pubblicazioni e presentazioni.',
        icona: 'T',
        colore: '#8b0000'
    },
    'servizio-monitoraggio': {
        nome: 'Monitoraggio',
        descrizione: 'Monitoraggio scadenze, rinnovi, opposizioni e concorrenti. Alert automatici via email e SMS.',
        icona: 'M',
        colore: '#7d6608'
    },
    'servizio-priorart-base': {
        nome: 'Ricerca Prior Art Base',
        descrizione: 'Ricerca essenziale nelle banche dati principali (EP, US, WO) per verificare la novita della tua invenzione.',
        icona: 'R',
        colore: '#1a5276'
    },
    'servizio-priorart-avanzata': {
        nome: 'Ricerca Prior Art Avanzata',
        descrizione: 'Ricerca approfondita in 15+ banche dati globali. Include analisi di famiglie brevettuali e mappa concorrenti.',
        icona: 'R+',
        colore: '#1a5276'
    },
    'servizio-analisi-brevettabilita': {
        nome: 'Analisi Brevettabilita',
        descrizione: 'Valutazione completa sui 3 criteri legali: novita, attivita inventiva, applicabilita industriale.',
        icona: 'A',
        colore: '#2c5f2d'
    },
    'servizio-claims-base': {
        nome: 'Redazione Claims Base',
        descrizione: 'Redazione delle rivendicazioni principali (indipendenti) per definire il campo di protezione del tuo brevetto.',
        icona: 'C',
        colore: '#6c3483'
    },
    'servizio-claims-pro': {
        nome: 'Redazione Claims Pro',
        descrizione: 'Redazione completa di rivendicazioni indipendenti + dipendenti. Strategia di protezione gerarchica.',
        icona: 'C+',
        colore: '#6c3483'
    },
    'servizio-traduzione-claims': {
        nome: 'Traduzione Claims',
        descrizione: 'Traduzione professionale delle rivendicazioni in inglese, francese, tedesco o spagnolo. Certificata per depositi internazionali.',
        icona: 'Tr',
        colore: '#1a5276'
    },
    'servizio-monitoraggio-concorrenza': {
        nome: 'Monitoraggio Concorrenza',
        descrizione: 'Sorveglianza attiva dei brevetti dei concorrenti in 5 settori tecnologici. Alert automatici via email.',
        icona: 'Mc',
        colore: '#7d6608'
    },
    'servizio-consulenza': {
        nome: 'Consulenza 1:1',
        descrizione: 'Sessione video 30 min con un esperto brevettuale. Domande, strategia, dubbi, next steps.',
        icona: 'C1',
        colore: '#2c5f2d'
    },
    'servizio-analisi-tecnica': {
        nome: 'Analisi Tecnica',
        descrizione: 'Valutazione tecnica approfondita della tua invenzione. Analisi di fattibilita e benchmark tecnologico.',
        icona: 'At',
        colore: '#2c5f2d'
    },
    'servizio-ricerca-figurativa': {
        nome: 'Ricerca Figurativa',
        descrizione: 'Ricerca di design e marchi simili alla tua invenzione. Include banche dati figurative EUIPO, USPTO, WIPO.',
        icona: 'Rf',
        colore: '#1a5276'
    },
    'servizio-analisi-nullita': {
        nome: 'Analisi Nullita',
        descrizione: 'Valutazione della validita di un brevetto esistente. Ricerca di elementi che potrebbero invalidare un brevetto concorrente.',
        icona: 'N',
        colore: '#8b0000'
    },
    'servizio-opposizione': {
        nome: 'Preparazione Opposizione',
        descrizione: 'Preparazione completa di un opposizione a brevetto. Raccolta prove, redazione argomentazioni, e presentazione all UIBM.',
        icona: 'O',
        colore: '#8b0000'
    },
    'servizio-licensing': {
        nome: 'Strategia Licensing',
        descrizione: 'Analisi delle opportunita di licenza per il tuo brevetto. Mappa dei potenziali licensee e bozza contratto.',
        icona: 'L',
        colore: '#7d6608'
    },
    'servizio-valorizzazione': {
        nome: 'Valorizzazione Brevetto',
        descrizione: 'Valutazione economica del tuo brevetto. Metodi: costo, mercato, reddito. Report per investitori o cessione.',
        icona: 'Val',
        colore: '#7d6608'
    },
    'servizio-due-diligence': {
        nome: 'Due Diligence IP',
        descrizione: 'Analisi completa del portfolio IP di un azienda target. Per M&A, investimenti, o partnership.',
        icona: 'DD',
        colore: '#1a5276'
    },
    'servizio-freedom-to-operate': {
        nome: 'Freedom to Operate',
        descrizione: 'Verifica che il tuo prodotto non violi brevetti esistenti. Ricerca in banche dati mondiali + analisi legale.',
        icona: 'FTO',
        colore: '#2c5f2d'
    },
    'servizio-patentability': {
        nome: 'Patentability Search',
        descrizione: 'Ricerca brevettuale in stile americano. Focus su prior art in inglese. Include analisi di citazioni e famiglie brevettuali.',
        icona: 'PS',
        colore: '#1a5276'
    },
    'servizio-landscape': {
        nome: 'Landscape Analysis',
        descrizione: 'Mappa tecnologica completa di un settore. Trend, concorrenti, white spaces, e opportunita. Report strategico 50+ pagine.',
        icona: 'La',
        colore: '#2c5f2d'
    },
    'servizio-cad': {
        nome: 'Disegno CAD Professionale',
        descrizione: 'Creazione di disegni tecnici CAD 2D/3D per brevetti. Formati: DWG, STEP, IGES. Pronti per UIBM e produzione.',
        icona: 'CAD',
        colore: '#2c5f2d'
    },
    'servizio-legale-base': {
        nome: 'Supporto Legale Base',
        descrizione: 'Consulenza legale su contratti IP (NDA, licenze, cessioni). Revisione di 1 contratto. Note e raccomandazioni.',
        icona: 'Leg',
        colore: '#6c3483'
    }
};

let servizioCorrente = null;
let utenteLoggato = null;

document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    servizioCorrente = params.get('servizio');
    mostraLogin();
});

function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const msg = document.getElementById('login-msg');
    
    if (!email || !password) {
        msg.textContent = 'Inserisci email e password';
        msg.style.color = '#8b0000';
        return;
    }
    
    utenteLoggato = {
        email: email,
        id: 'user_' + Date.now(),
        loginTime: Date.now()
    };
    
    localStorage.setItem('brevettiamo_user', JSON.stringify(utenteLoggato));
    mostraMenu();
}

function logout() {
    localStorage.removeItem('brevettiamo_user');
    utenteLoggato = null;
    location.reload();
}

function mostraLogin() {
    document.getElementById('login-panel').classList.remove('hidden');
    document.getElementById('menu-panel').classList.add('hidden');
    document.getElementById('flusso-iframe').style.display = 'none';
    document.getElementById('user-bar').classList.add('hidden');
    
    const info = document.getElementById('nome-servizio');
    if (servizioCorrente && SERVIZI[servizioCorrente]) {
        const s = SERVIZI[servizioCorrente];
        info.innerHTML = '<strong>' + s.nome + '</strong><br><span style="font-size:0.85rem;color:#8b7355">' + s.descrizione + '</span>';
    } else {
        info.innerHTML = 'Nessun servizio selezionato. Scegli dal menu.';
    }
}

function mostraMenu() {
    document.getElementById('login-panel').classList.add('hidden');
    document.getElementById('menu-panel').classList.remove('hidden');
    document.getElementById('flusso-iframe').style.display = 'none';
    document.getElementById('user-bar').classList.remove('hidden');
    
    if (utenteLoggato) {
        document.getElementById('user-email').textContent = utenteLoggato.email;
    }
    
    const grid = document.getElementById('servizi-grid');
    grid.innerHTML = '';
    
    Object.entries(SERVIZI).forEach(function([id, s]) {
        const card = document.createElement('div');
        card.className = 'servizio-card';
        card.innerHTML = 
            '<div style="font-size:2rem;color:' + s.colore + ';margin-bottom:10px;font-family:\'Cinzel\',serif;font-weight:bold;">' + s.icona + '</div>' +
            '<h4>' + s.nome + '</h4>' +
            '<p>' + s.descrizione + '</p>';
        card.onclick = function() { avviaServizio(id); };
        grid.appendChild(card);
    });
    
    if (servizioCorrente && SERVIZI[servizioCorrente]) {
        avviaServizio(servizioCorrente);
    }
}

function avviaServizio(servizioId) {
    servizioCorrente = servizioId;
    document.getElementById('menu-panel').classList.add('hidden');
    document.getElementById('login-panel').classList.add('hidden');
    
    const iframe = document.getElementById('flusso-iframe');
    iframe.style.display = 'block';
    
    const flussoUrl = '../welcome.html?servizio=' + encodeURIComponent(servizioId);
    iframe.src = flussoUrl;
}

function tornaMenu() {
    document.getElementById('flusso-iframe').style.display = 'none';
    document.getElementById('flusso-iframe').src = '';
    mostraMenu();
}

window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'brevettiamo') {
        if (e.data.action === 'logout') {
            logout();
        } else if (e.data.action === 'torna-menu') {
            tornaMenu();
        }
    }
});
</script>

</body>
</html>
