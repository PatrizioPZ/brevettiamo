name: BrevettIAmo Brain v2.0

on:
  push:
    paths:
      - 'brain-request.txt'
  workflow_dispatch:

jobs:
  brain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/brain-engine.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "Brain"
          git config user.email "brain@brevettiamo.com"
          git pull --rebase origin main
          git add -A
          git diff --staged --quiet || git commit -m "brain: done"
          git push
