name: BrevettIAmo Brain - Autonomous v2.0

on:
  push:
    paths:
      - 'brain-request.txt'
  workflow_dispatch:

jobs:
  brain-execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Brain Engine v2.0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 scripts/brain-engine.py
      
      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "BrevettIAmo Brain"
          git config user.email "brain@brevettiamo.com"
          rm -f brain-request.txt
          git add -A
          git diff --staged --quiet || git commit -m "brain: ESEGUIRE approvato | 7 Cappelli | v2.0"
          git push
