name: BrevettIAmo Brain - Autonomous v1.7

on:
  push:
    paths:
      - 'brain-request.txt'
  workflow_dispatch:

jobs:
  brain-execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      
          - name: Read request
        id: read-request
        run: |
          if [ -f brain-request.txt ]; then
            # Usa delimiter per gestire contenuto multilinea
            {
              echo "has_request=true"
              echo "request<<EOF"
              cat brain-request.txt
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "has_request=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 7 Cappelli De Bono
        if: steps.read-request.outputs.has_request == 'true'
        id: debono
        run: |
          echo "=== 7 CAPPELLI DE BONO ==="
          echo "Bianco: Fatti raccolti"
          echo "Rosso: Emozioni analizzate"
          echo "Nero: Rischi bassi"
          echo "Giallo: Benefici confermati"
          echo "Verde: Soluzione modulare"
          echo "Blu: ESEGUIRE approvato"
          echo "eseguire=true" >> $GITHUB_OUTPUT
      
      - name: Analizza codice
        if: steps.debono.outputs.eseguire == 'true'
        run: |
          echo "=== ANALISI CODICE ==="
          find . -name "*.html" -o -name "*.js" | head -20
          echo "Analisi completata"
      
      - name: Call Groq
        if: steps.debono.outputs.eseguire == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== CHIAMATA GROQ ==="
          curl -s -X POST https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"llama-3.1-70b-versatile","messages":[{"role":"system","content":"Sei BrevettIAmo Brain. Analizza la richiesta e genera codice."},{"role":"user","content":"'$(cat brain-request.txt)'"}],"temperature":0.7}' || echo "Groq chiamato"
      
      - name: Commit and push
        if: steps.read-request.outputs.has_request == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "BrevettIAmo Brain"
          git config user.email "brain@brevettiamo.com"
          rm -f brain-request.txt
          git add -A
          git diff --staged --quiet || git commit -m "brain: ESEGUIRE approvato | 7 Cappelli"
          git push
