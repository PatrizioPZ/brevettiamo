name: Autofix BrevettIAmo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Autofix Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      run: |
        python scripts/autofix.py

    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push fixes
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "autofix@brevettiamo.ai"
        git config --local user.name "BrevettIAmo Autofix"
        git add -A
        git commit -m "Autofix: correzione errori rilevati da IA"
        git push
