name: BrevettIAmo Brain - Autonomous v4.0 Multi-Agente

on:
  push:
    branches: [main, development]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task per il CEO Orchestrator'
        required: true
        default: 'Verifica sistema'
      file_path:
        description: 'Percorso file da generare'
        required: false
        default: ''
      file_type:
        description: 'Tipo file (html, js, css, py)'
        required: false
        default: 'html'

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests PyYAML

      - name: CEO Orchestrator v4.0 Multi-Agente
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CEO_TASK: ${{ toJson(github.event.inputs) }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: python scripts/ceo_orchestrator_v4.py
