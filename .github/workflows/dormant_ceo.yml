name: Sleeper Agent Autonomous Pipeline v2.1

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task specifico'
        required: false
        default: 'auto'
  push:
    branches:
      - main
      - development
    paths:
      - 'task.json'
      - 'scripts/secret_manager.py'
      - 'scripts/ceo_orchestrator.py'

jobs:
  autonomous-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests PyYAML

      - name: Secret Manager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/secret_manager.py

      - name: CEO Orchestrator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/ceo_orchestrator.py

      - name: Commit e Push
        if: success()
        run: |
          git config --global user.name 'BrevettIAmo-CEO'
          git config --global user.email 'ceo@brevettiamo.local'
          git add -A
          if git diff --staged --quiet; then
            echo "Nessuna modifica."
            exit 0
          fi
          git commit -m "brain: aggiornamento $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Promozione Staging
        if: success() && github.ref == 'refs/heads/development'
        run: |
          git checkout staging || git checkout -b staging
          git merge development --no-ff -m "Promozione Staging [skip ci]"
          git push origin staging

      - name: Promozione Production
        if: success() && github.ref == 'refs/heads/staging'
        run: |
          git checkout production || git checkout -b production
          git merge staging --no-ff -m "Rilascio Produzione [skip ci]"
          git push origin production
