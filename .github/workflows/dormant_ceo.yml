name: Sleeper Agent Autonomous Pipeline
on:
  push:
    branches:
      - development
    paths:
      - 'task.json'

jobs:
  autonomous-execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Ambiente Gratuito
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze Core
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Secret Manager - Scan e Rotazione API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/secret_manager.py

      - name: Esecuzione Orchestratore e Sandbox Agno
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: python scripts/ceo_orchestrator.py

      - name: Promozione Automatica Livello 2 (Staging)
        if: success()
        run: |
          git config --global user.name 'BrevettIAmo-CEO-Orchestrator'
          git config --global user.email 'ceo-agent@brevettiamo.local'
          git checkout staging || git checkout -b staging
          git merge development --no-ff -m "Promozione Staging: Sandbox Superata [skip ci]"
          git push origin staging

      - name: Promozione Automatica Livello 3 (Production - GitHub Pages)
        if: success()
        run: |
          git checkout production || git checkout -b production
          git merge staging --no-ff -m "Rilascio Automatico in Produzione: Sistema Integro [skip ci]"
          git push origin production
