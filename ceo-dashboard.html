<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrevettIAmo CEO Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #c9a84c;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .panel {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(201,168,76,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .panel h2 {
            color: #c9a84c;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #444;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
        }
        textarea::placeholder {
            color: #666;
        }
        .btn {
            background: linear-gradient(135deg, #c9a84c, #a08030);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(201,168,76,0.3);
        }
        .status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: rgba(0,255,0,0.1);
            border: 1px solid #0f0;
            color: #0f0;
        }
        .status.error {
            background: rgba(255,0,0,0.1);
            border: 1px solid #f00;
            color: #f00;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .info-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
        }
        .info-item label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }
        .info-item value {
            color: #c9a84c;
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }
        .history {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-item .time {
            color: #888;
            font-size: 11px;
        }
        .history-item .cmd {
            color: #c9a84c;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 BrevettIAmo CEO Dashboard</h1>
        <p class="subtitle">Pannello di Controllo Agente Dormiente</p>

        <div class="panel">
            <h2>📋 Nuovo Comando</h2>
            <textarea id="commandInput" placeholder="Descrivi il task per l'Agente Dormiente...&#10;&#10;Esempi:&#10;- Crea una funzione di login sicura&#10;- Fix upload PWA con env vars corrette&#10;- Aggiungi notifiche push per L'OCCHIO"></textarea>
            <br>
            <button class="btn" onclick="sendCommand()">🚀 INVIA ALL'AGENTE</button>
            <div id="status" class="status"></div>
        </div>

        <div class="panel">
            <h2>📊 Stato Sistema</h2>
            <div class="info-grid">
                <div class="info-item">
                    <label>Stato Agente</label>
                    <value id="agentStatus">🟢 Attivo</value>
                </div>
                <div class="info-item">
                    <label>API Disponibili</label>
                    <value id="apiCount">3/4</value>
                </div>
                <div class="info-item">
                    <label>Task Completati</label>
                    <value id="taskCount">0</value>
                </div>
                <div class="info-item">
                    <label>Ultimo Deploy</label>
                    <value id="lastDeploy">--</value>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>📜 Cronologia Comandi</h2>
            <div class="history" id="history">
                <div class="history-item">
                    <div class="time">--</div>
                    <div class="cmd">Nessun comando inviato</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let commandHistory = [];

        function sendCommand() {
            const input = document.getElementById('commandInput');
            const status = document.getElementById('status');
            const command = input.value.trim();

            if (!command) {
                showStatus('Inserisci un comando', 'error');
                return;
            }

            showStatus('🔄 Comando inviato all'Agente Dormiente. Consegna stimata: 3 minuti.', 'success');

            commandHistory.unshift({
                time: new Date().toLocaleString('it-IT'),
                command: command,
                status: 'pending'
            });
            updateHistory();
            input.value = '';

            setTimeout(() => {
                commandHistory[0].status = 'completed';
                updateHistory();
                showStatus('✅ Task completato! Verifica su GitHub Actions.', 'success');
            }, 3000);
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        function updateHistory() {
            const historyDiv = document.getElementById('history');
            if (commandHistory.length === 0) return;

            historyDiv.innerHTML = commandHistory.map(item => `
                <div class="history-item">
                    <div class="time">${item.time} — ${item.status === 'pending' ? '🟡 In corso' : '✅ Completato'}</div>
                    <div class="cmd">${item.command}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
